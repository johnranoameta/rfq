<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RFQ Assistant · Sleek</title>
<style>
/* ════════ SLEEK — typeui.sh design system · deep navy · pill controls · auto dark mode ════════ */
:root{
  /* neutrals */
  --bg:#F9FAFB; --surface:#FFFFFF; --raised:#F3F4F6; --hover:#F3F4F6;
  --line:#E5E7EB; --line2:#D1D5DC;
  --ink:#111828; --ink2:#4B5563; --ink3:#6B7280;
  /* brand (navy) */
  --accent:#111828; --accent-d:#0C111D; --accent-soft:#F1F3F7; --accent-line:#CFD5E1;
  /* status */
  --high:#C70036; --high-soft:#FEF0F2; --med:#C2410C; --med-soft:#FFF7ED; --low:#6B7280; --low-soft:#F3F4F6;
  /* shadows */
  --sh-xs:0 1px 2px 0 #0000000d; --sh-sm:0 1px 3px 0 #0000001a,0 1px 2px -1px #0000001a;
  --sh-md:0 4px 6px -1px #0000001a,0 2px 4px -2px #0000001a; --sh-lg:0 10px 15px -3px #0000001a,0 4px 6px -4px #0000001a;
  --glint:inset rgba(255,255,255,.25) 0 6px 0 -5px, rgba(0,0,0,.12) 0 4px 10px -5px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Lotus Eden",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
/* forced dark via toggle */
:root[data-theme="dark"]{
  --bg:#030712; --surface:#101828; --raised:#1E2939; --hover:#1E2939;
  --line:#1F2937; --line2:#374151;
  --ink:#FFFFFF; --ink2:#9CA3AF; --ink3:#9CA3AF;
  --accent:#3F5071; --accent-d:#CFD5E1; --accent-soft:#1A2236; --accent-line:#232D48;
  --high:#C70036; --high-soft:#4D0218; --med:#F97316; --med-soft:#7C2D12; --low:#9CA3AF; --low-soft:#1E2939;
  --glint:inset rgba(255,255,255,.12) 0 6px 0 -5px, rgba(0,0,0,.25) 0 4px 10px -5px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#030712; --surface:#101828; --raised:#1E2939; --hover:#1E2939;
    --line:#1F2937; --line2:#374151;
    --ink:#FFFFFF; --ink2:#9CA3AF; --ink3:#9CA3AF;
    --accent:#3F5071; --accent-d:#CFD5E1; --accent-soft:#1A2236; --accent-line:#232D48;
    --high:#C70036; --high-soft:#4D0218; --med:#F97316; --med-soft:#7C2D12; --low:#9CA3AF; --low-soft:#1E2939;
    --glint:inset rgba(255,255,255,.12) 0 6px 0 -5px, rgba(0,0,0,.25) 0 4px 10px -5px;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13.5px}
.num{font-variant-numeric:tabular-nums}
.app{display:flex;flex-direction:column;height:100vh}

/* header */
.hdr{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 22px 0;flex-shrink:0}
.hdr-top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.logo{width:32px;height:32px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.hdr-title{font-size:16px;font-weight:700;letter-spacing:-.01em}
.hdr-sub{font-family:var(--mono);font-size:12px;color:var(--ink3)}
.case-sel{margin-left:auto;display:flex;gap:6px}
.cs{padding:7px 13px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.cs:hover{border-color:var(--accent-line)}
.cs.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-d)}
.cs .rk{font-family:var(--mono);font-size:10px;margin-left:5px;opacity:.7}

/* workflow spine */
.spine{display:flex;align-items:center;padding:0 0 14px;overflow-x:auto}
.sp-s{display:flex;align-items:center;gap:9px;flex-shrink:0}
.sp-n{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid var(--line2);color:var(--ink3);background:#fff}
.sp-l{font-size:12px;font-weight:600;color:var(--ink3);white-space:nowrap}
.sp-line{width:30px;height:2px;background:var(--line2);margin:0 8px;flex-shrink:0}
.sp-done .sp-n{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-d)}.sp-done .sp-l{color:var(--ink2)}.sp-line.done{background:var(--accent)}
.sp-active .sp-n{background:var(--accent);border-color:var(--accent);color:#fff}.sp-active .sp-l{color:var(--accent-d);font-weight:700}

/* tabs */
.tabbar{display:flex;gap:4px;padding:0 22px;background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0}
.tab{padding:11px 16px;font-size:13.5px;font-weight:600;color:var(--ink2);cursor:pointer;border-bottom:2.5px solid transparent;display:flex;align-items:center;gap:8px}
.tab:hover{color:var(--ink)}.tab.on{color:var(--accent-d);border-bottom-color:var(--accent)}
.tab .cnt{font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:20px;background:var(--hover);color:var(--ink2)}.tab.on .cnt{background:var(--accent-soft);color:var(--accent-d)}

.content{flex:1;overflow-y:auto;padding:22px;min-width:0}
.panel{display:none}.panel.on{display:block}
.maxw{max-width:1120px}
.sec-lab{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin:22px 0 12px}.sec-lab:first-child{margin-top:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:11px}
.card-h{padding:13px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px}

/* HERO KPI tiles */
.hero{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:15px;margin-bottom:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;position:relative}
.kpi .l{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
.kpi .v{font-size:34px;font-weight:800;letter-spacing:-.02em;margin-top:6px;line-height:1}
.kpi .sub{font-size:12px;color:var(--ink2);margin-top:8px}
.gauge{display:flex;align-items:center;gap:18px}
.gauge svg{flex-shrink:0}
.gauge .gv{font-size:38px;font-weight:800;letter-spacing:-.02em}
.gauge .gl{font-size:12px;color:var(--ink2);margin-top:3px}
.sev-mini{display:flex;gap:7px;margin-top:12px}
.sev-mini span{flex:1;text-align:center;border-radius:7px;padding:7px 4px;font-weight:700}
.sev-mini .n{font-size:18px}.sev-mini .t{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;opacity:.8}
.bar{height:7px;border-radius:7px;background:var(--hover);overflow:hidden;margin-top:10px}.bar>i{display:block;height:100%}

.ig{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.if{background:var(--surface);padding:13px 16px}
.if .l{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.if .v{font-size:13px;font-weight:600}.if .v.warn{color:var(--med)}.if .v.bad{color:var(--high)}.if .v.ok{color:var(--accent-d)}
.note{display:flex;gap:11px;padding:13px 16px;border:1px solid var(--line);border-left-width:4px;border-radius:9px;background:var(--surface);margin-bottom:9px}
.note.high{border-left-color:var(--high)}.note.medium{border-left-color:var(--med)}.note.low{border-left-color:var(--low)}
.note .ti{font-weight:700;font-size:13px}.note .tx{font-size:12.5px;color:var(--ink2);margin-top:3px;line-height:1.55}
.note .sv{font-family:var(--mono);font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;height:fit-content}

table.tbl{width:100%;border-collapse:collapse;background:var(--surface)}
.tbl th{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink3);text-align:left;padding:11px 17px;border-bottom:1px solid var(--line);background:var(--raised)}
.tbl td{padding:12px 17px;border-bottom:1px solid var(--line);font-size:13px}.tbl tr:last-child td{border-bottom:none}.tbl tr:hover td{background:var(--raised)}
.tbl.r th,.tbl.r td{text-align:right}.tbl.r th:first-child,.tbl.r td:first-child,.tbl.r th:nth-child(2),.tbl.r td:nth-child(2){text-align:left}
.dtag{font-family:var(--mono);font-size:11px;padding:2px 9px;border-radius:6px;background:var(--accent-soft);color:var(--accent-d)}
.pst{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600}.pst .d{width:7px;height:7px;border-radius:50%}.pst.ok{color:var(--accent-d)}.pst.ok .d{background:var(--accent)}.pst.miss{color:var(--high)}.pst.miss .d{background:var(--high)}
.minibar{display:inline-block;width:54px;height:5px;border-radius:3px;background:var(--hover);overflow:hidden;vertical-align:middle;margin-left:7px}.minibar>i{display:block;height:100%}
.flags{display:flex;gap:8px;flex-wrap:wrap;padding:3px 0}.flag{font-size:12px;font-weight:600;padding:4px 11px;border-radius:20px}
.flag.y{background:var(--accent-soft);color:var(--accent-d)}.flag.n{background:var(--high-soft);color:var(--high)}.flag.w{background:var(--med-soft);color:var(--med)}

/* ════════ GAP — severity buckets (accordion of groups) ════════ */
.gaptools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.gsearch{position:relative;flex:1;min-width:200px;max-width:360px}
.gsearch input{width:100%;padding:9px 11px 9px 33px;border:1px solid var(--line2);border-radius:8px;font-size:13px;font-family:var(--sans);background:var(--surface)}
.gsearch svg{position:absolute;left:10px;top:9px;width:15px;height:15px;color:var(--ink3)}
.fchip{font-size:12px;font-weight:600;padding:7px 13px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);color:var(--ink2);cursor:pointer}
.fchip:hover{border-color:var(--accent-line)}.fchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.seg{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;margin-left:auto}
.seg button{padding:7px 13px;font-size:12.5px;font-weight:600;border:none;background:var(--surface);color:var(--ink2);cursor:pointer;border-right:1px solid var(--line2)}.seg button:last-child{border-right:none}.seg button.on{background:var(--accent);color:#fff}

.bucket{background:var(--surface);border:1px solid var(--line);border-radius:11px;margin-bottom:13px;overflow:hidden}
.bucket-h{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;user-select:none}
.bucket-h:hover{background:var(--raised)}
.bk-bar{width:5px;height:30px;border-radius:5px;flex-shrink:0}
.bk-title{font-size:15px;font-weight:700}
.bk-count{font-family:var(--mono);font-size:12px;font-weight:700;padding:3px 11px;border-radius:20px}
.bk-chev{margin-left:auto;color:var(--ink3);transition:transform .15s}
.bucket.closed .bk-chev{transform:rotate(-90deg)}
.bucket.closed .bucket-body{display:none}
.bucket-body{border-top:1px solid var(--line)}

.fitem{border-bottom:1px solid var(--line)}
.fitem:last-child{border-bottom:none}
.fitem-h{display:flex;align-items:center;gap:12px;padding:12px 18px;cursor:pointer}
.fitem-h:hover{background:var(--raised)}
.fitem .sevdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.fitem .rcode{font-family:var(--mono);font-size:11px;color:var(--ink3);background:var(--raised);border:1px solid var(--line);padding:2px 8px;border-radius:6px;flex-shrink:0}
.fitem .ttl{font-size:13.5px;font-weight:600;flex:1;min-width:0}
.fitem .ptag{font-family:var(--mono);font-size:10.5px;color:var(--accent-d);background:var(--accent-soft);padding:2px 8px;border-radius:6px;flex-shrink:0}
.fitem .imp{font-size:12px;color:var(--high);font-weight:600;flex-shrink:0;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fitem .chev{color:var(--ink3);transition:transform .15s;flex-shrink:0}
.fitem.open .chev{transform:rotate(180deg)}
.fitem-body{display:none;padding:2px 18px 18px 41px}
.fitem.open .fitem-body{display:block}
.fitem-body .det{font-size:13px;color:var(--ink2);line-height:1.65;margin:8px 0 12px}
.fmeta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:13px;margin-bottom:12px}
.fmeta .l{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);margin-bottom:3px}.fmeta .v{font-size:12.5px;font-weight:600;font-family:var(--mono)}
.actbox{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:8px;padding:12px 15px}
.actbox .l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-d);margin-bottom:5px}.actbox p{font-size:13px;color:var(--ink2);line-height:1.55}
.histcmp{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.histcmp>div{background:var(--surface);padding:10px 13px}.histcmp .l{font-size:10px;text-transform:uppercase;color:var(--ink3);margin-bottom:3px}.histcmp .v{font-size:12.5px;font-weight:700;font-family:var(--mono)}

.qhead{display:flex;gap:22px;align-items:center;flex-wrap:wrap;padding:17px}
.qk .l{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}.qk .v{font-family:var(--mono);font-size:15px;font-weight:700;margin-top:3px}.qk .v.big{font-size:20px;color:var(--accent-d)}
.qsep{width:1px;height:38px;background:var(--line)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.cb-row{display:flex;align-items:center;gap:11px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}.cb-row:last-child{border-bottom:none}.cb-row .l{color:var(--ink2);width:120px}.cb-row .track{flex:1;height:5px;border-radius:3px;background:var(--hover);overflow:hidden}.cb-row .track>i{display:block;height:100%;background:var(--accent)}.cb-row .v{font-family:var(--mono);font-weight:600;width:68px;text-align:right}
.bm-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.bm-row:last-child{border-bottom:none}.bm-row .pj{font-family:var(--mono);font-size:12px;color:var(--accent-d);font-weight:700}.bm-row .meta{flex:1;color:var(--ink2);font-size:12px}.bm-row .pr{font-family:var(--mono);font-weight:700}
.bm-out{font-family:var(--mono);font-size:11px;padding:2px 9px;border-radius:20px}.won{background:var(--accent-soft);color:var(--accent-d)}.lost{background:var(--high-soft);color:var(--high)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#c6d0ca;border-radius:6px;border:2px solid var(--bg)}
.empty{padding:40px;text-align:center;color:var(--ink3)}

/* ════════ SLEEK polish — pill controls · 24px radii · shadow tokens · auto dark ════════ */
body{font-size:14px;-webkit-font-smoothing:antialiased}
.hdr{padding:16px 30px;background:var(--surface);border-bottom:1px solid var(--line)}
.hdr-top{margin-bottom:0}
.hdr-title{font-weight:800;font-size:19px;letter-spacing:-.4px;color:var(--ink)}
.hdr-sub{color:var(--ink3)}
.logo{border-radius:9999px;background:var(--accent);color:#fff;box-shadow:var(--sh-xs),var(--glint);font-weight:800}
/* theme toggle — pill icon button */
.theme-toggle{margin-left:12px;width:40px;height:40px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;border-radius:9999px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);box-shadow:var(--sh-xs);cursor:pointer;transition:all .2s}
.theme-toggle:hover{background:var(--hover);color:var(--ink);border-color:var(--line2)}
.theme-toggle .ic-moon{display:none}
:root[data-theme="dark"] .theme-toggle .ic-sun{display:none}
:root[data-theme="dark"] .theme-toggle .ic-moon{display:inline}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .theme-toggle .ic-sun{display:none}
  :root:not([data-theme="light"]) .theme-toggle .ic-moon{display:inline}
}
/* case switcher → pill segmented */
.cs{border-radius:9999px;padding:8px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);box-shadow:var(--sh-xs);font-weight:500}
.cs:hover{background:var(--hover);color:var(--ink);border-color:var(--line2)}
.cs.on{background:var(--accent);border-color:transparent;color:#fff;box-shadow:var(--sh-xs),var(--glint)}
.cs.on .rk{color:#fff;opacity:.75}
/* tabs → pill */
.tabbar{padding:12px 30px;background:var(--surface);border-bottom:1px solid var(--line);gap:6px}
.tab{border-bottom:none;border-radius:9999px;padding:10px 18px;font-size:14px;font-weight:500;color:var(--ink2);transition:all .2s}
.tab:hover{background:var(--hover);color:var(--ink)}
.tab.on{background:var(--accent);color:#fff;box-shadow:var(--sh-sm)}
.tab.on .cnt{background:rgba(255,255,255,.22);color:#fff}
.tab .cnt{border-radius:9999px;background:var(--hover);color:var(--ink2)}
.content{padding:30px;background:var(--bg)}
.sec-lab{letter-spacing:.4px;text-transform:uppercase;font-weight:500;color:var(--ink3);margin:30px 0 14px}
/* containers → 24px + shadow-sm */
.card,.kpi,.ig{border-radius:24px;border:1px solid var(--line);box-shadow:var(--sh-sm)}
.card{background:var(--surface)} .kpi{background:var(--surface);padding:22px 24px}
.card-h{padding:16px 24px;font-weight:500;color:var(--ink);font-size:15px;border-bottom:1px solid var(--line)}
.kpi .l{letter-spacing:.4px;color:var(--ink3)} .kpi .v{font-weight:800;letter-spacing:-.5px;color:var(--ink)}
.hero{gap:24px}
.ig{overflow:hidden} .if{background:var(--surface);padding:16px 20px} .if .l{letter-spacing:.3px;color:var(--ink3)} .if .v{color:var(--ink)}
.note{border-radius:24px;border:1px solid var(--line);border-left-width:3px;padding:16px 20px;box-shadow:var(--sh-xs);background:var(--surface)}
.note .ti{color:var(--ink)} .note .tx{color:var(--ink2)}
/* badges / sev pills → pill + status tokens */
.sv,.bk-count,.grp-pill,.ptag,.dtag,.flag,.bm-out{border-radius:9999px}
.flag{padding:4px 12px;font-weight:500;border:1px solid var(--line)}
.flag.y{background:var(--accent-soft);color:var(--accent-d);border-color:var(--accent-line)}
.flag.n{background:var(--high-soft);color:var(--high);border-color:var(--high-soft)}
.flag.w{background:var(--med-soft);color:var(--med);border-color:var(--med-soft)}
.dtag{background:var(--accent-soft);color:var(--accent-d)}
.won{background:var(--accent-soft);color:var(--accent-d)} .lost{background:var(--high-soft);color:var(--high)}
/* tables → 24px wrapper, pill nothing, head tint */
.tbl th{background:var(--bg);color:var(--ink2);font-weight:500;letter-spacing:.2px;border-bottom:1px solid var(--line)}
.tbl td{border-bottom:1px solid var(--line);color:var(--ink2)} .tbl tr:hover td{background:var(--bg)}
.pst.ok{color:var(--accent-d)} .pst.ok .d{background:var(--accent)}
/* gap controls → pill */
.fchip{border-radius:9999px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);box-shadow:var(--sh-xs);padding:8px 14px;font-weight:500}
.fchip:hover{background:var(--hover);color:var(--ink);border-color:var(--line2)}
.fchip.on{background:var(--accent);border-color:transparent;color:#fff;box-shadow:var(--sh-xs),var(--glint)}
.gsearch input{border-radius:9999px;border:1px solid var(--line2);background:var(--surface);box-shadow:var(--sh-sm);color:var(--ink);padding:10px 14px 10px 36px}
.gsearch input::placeholder{color:var(--ink3)} .gsearch svg{left:13px;color:var(--ink3)}
.seg{border-radius:9999px;border:1px solid var(--line);overflow:hidden;box-shadow:var(--sh-xs)}
.seg button{background:var(--surface);color:var(--ink2);border-color:var(--line)} .seg button.on{background:var(--accent);color:#fff}
/* gap buckets / items → 24px airy, status accents */
.bucket{border-radius:24px;border:1px solid var(--line);box-shadow:var(--sh-sm);background:var(--surface);margin-bottom:14px;overflow:hidden}
.bucket-h{padding:16px 22px;background:var(--surface)} .bucket-h:hover{background:var(--hover)}
.bk-title{color:var(--ink);font-weight:500} .bk-bar{border-radius:9999px;width:4px;height:26px}
.bucket-body{border-top:1px solid var(--line)}
.fitem{border-bottom:1px solid var(--line)} .fitem-h{padding:14px 22px} .fitem-h:hover{background:var(--hover)}

let CUR='A', GFILTER='all', GQ='', GMODE='sev';

function renderCaseSel(){

}

function switchTab(t,el){

  document.getElementById('p-'+t).classList.add('on');el.classList.add('on');
}
function renderAll(){

function gaugeSVG(score){

}

    <div class="sec-lab">Package Files — ${c.docs.length} Documents${miss?' · '+miss+' missing':''}</div>
    <div class="card" style="overflow:hidden"><table class="tbl"><thead><tr><th>File Name</th><th>Type</th><th>Status</th><th>Confidence</th><th>Notes</th></tr></thead><tbody>
    ${c.docs.map(d=>{const conf=d.conf!=null?`<span class="num" style="color:${d.conf>=0.9?'var(--accent-d)':'var(--med)'};font-weight:600">${d.conf.toFixed(2)}</span><span class="minibar"><i style="width:${d.conf*100}%;background:${d.conf>=0.9?'var(--accent)':'var(--med)'}"></i></span>`:'<span style="color:var(--ink3)">—</span>';
      return `<tr><td style="font-weight:600;color:${d.status==='miss'?'var(--high)':'var(--ink)'}">${d.status==='miss'?'⚠ ':''}${esc(d.name)}</td><td><span class="dtag">${DOC_TYPE_LABEL[d.type]||d.type}</span></td><td><span class="pst ${d.status==='ok'?'ok':'miss'}"><span class="d"></span>${d.status==='ok'?'Parsed':'Missing'}</span></td><td>${conf}</td><td style="color:var(--ink2);font-size:12.5px">${esc(d.note)}</td></tr>`;}).join('')}
    </tbody></table></div>
    <div class="card" style="margin-top:13px;padding:13px 18px;font-size:13px;color:var(--ink2)"><b style="color:${miss>=2?'var(--high)':miss===1?'var(--med)':'var(--accent-d)'}">Completeness risk: ${miss>=2?'HIGH':miss===1?'MEDIUM':'LOW'}</b> — ${miss===0?'All referenced documents received and parsed.':miss+' referenced document'+(miss>1?'s':'')+' missing. '+(miss>=2?'Quote release blocked until resolved.':'Address before release.')}</div>`;
}

function renderParts(c){
  document.getElementById('p-parts').innerHTML=`
    <div class="sec-lab">Part Technical Data — ${esc(c.part_number)}</div>
    <div class="card">
      <div class="card-h">${esc(c.title)} ${c.multi_part?'<span class="dtag" style="margin-left:8px">'+c.sub_parts.length+' sub-parts</span>':''}</div>
      <div class="ig" style="border:none;border-radius:0">
        ${ifield('Customer',c.customer)}${ifield('Program',c.program)}${ifield('SOP Date',c.sop)}${ifield('Annual Volume',c.annual_vol.toLocaleString())}
        ${ifield('Material',c.material,c.material.includes('980')||c.material.includes('AA')?'warn':'')}${ifield('Thickness',c.thickness+' mm')}
        ${ifield('General Tol.',c.tolerance,c.tolerance.includes('0.03')?'bad':'')}${ifield('Critical Tol.',c.critical_tol,(c.critical_tol.includes('0.10')||c.critical_tol.includes('0.03'))?'bad':'')}
        ${ifield('PPAP','L'+c.ppap,c.ppap>=5?'bad':'')}${ifield('Cpk Target',c.cpk)}${ifield('Incoterm',c.incoterm,c.incoterm.startsWith('DDP')?'warn':'')}${ifield('Tooling Owner',c.tooling_owner)}
      </div>
      <div style="padding:13px 18px;border-top:1px solid var(--line)"><div class="sec-lab" style="margin:0 0 9px">Process Route</div><div style="font-size:13px;color:var(--ink2);font-family:var(--mono)">${c.process.join('  →  ')}</div></div>
      ${c.multi_part?`<div style="padding:13px 18px;border-top:1px solid var(--line)"><div class="sec-lab" style="margin:0 0 9px">Sub-Parts</div><div class="flags">${c.sub_parts.map(p=>`<span class="flag y">${esc(p)}</span>`).join('')}</div></div>`:''}
      <div style="padding:13px 18px;border-top:1px solid var(--line)"><div class="sec-lab" style="margin:0 0 9px">Surface Requirements</div><div class="flags">${c.surface.map(s=>`<span class="flag y">${esc(s)}</span>`).join('')}</div></div>
      <div style="padding:13px 18px;border-top:1px solid var(--line)"><div class="sec-lab" style="margin:0 0 9px">Compliance Flags</div><div class="flags">
        <span class="flag y">PPAP L${c.ppap}</span><span class="flag ${c.completeness==='complete'?'y':'n'}">Packaging ${c.completeness==='complete'?'✓':'⚠'}</span>
        <span class="flag ${c.triggered_rules.includes('RULE_002')?'n':'y'}">Test Std ${c.triggered_rules.includes('RULE_002')?'⚠':'✓'}</span>
        ${c.supplier_funded_gauges?'<span class="flag w">Supplier Gauges</span>':''}${c.incoterm.startsWith('DDP')?'<span class="flag w">DDP Freight</span>':''}
        <span class="flag ${c.apd>=4?'n':c.apd>=3?'w':'y'}">${c.apd}% APD</span><span class="flag ${c.payment.includes('120')?'n':c.payment.includes('60')||c.payment.includes('75')?'y':'w'}">${c.payment}</span>
      </div></div>
    </div>`;
}

/* ── GAP: severity buckets / sub-part buckets ── */
function renderGap(c){
  const cnt=s=>c.gap_findings.filter(x=>x.sev===s).length;
  const cats=[...new Set(c.gap_findings.map(x=>x.cat))];
  document.getElementById('p-gap').innerHTML=`
    <div class="gaptools">
      <div class="gsearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg><input id="gq" placeholder="Search ${c.gap_findings.length} findings…" oninput="onSearch(this.value)" value="${esc(GQ)}"></div>
      <div class="fchip ${GFILTER==='all'?'on':''}" onclick="setF('all')">All ${c.gap_findings.length}</div>
      <div class="fchip ${GFILTER==='high'?'on':''}" onclick="setF('high')">High ${cnt('high')}</div>
      <div class="fchip ${GFILTER==='medium'?'on':''}" onclick="setF('medium')">Medium ${cnt('medium')}</div>
      ${cnt('low')?`<div class="fchip ${GFILTER==='low'?'on':''}" onclick="setF('low')">Low ${cnt('low')}</div>`:''}
      ${cats.map(ct=>`<div class="fchip ${GFILTER==='cat:'+ct?'on':''}" onclick="setF('cat:${ct}')">${ct[0].toUpperCase()+ct.slice(1)}</div>`).join('')}
      ${c.multi_part?`<div class="seg"><button class="${GMODE==='sev'?'on':''}" onclick="setMode('sev')">By severity</button><button class="${GMODE==='part'?'on':''}" onclick="setMode('part')">By sub-part</button></div>`:''}
    </div>
    <div id="buckets"></div>`;
  renderBuckets(c);
}
function setF(f){GFILTER=f;renderGap(CASES[CUR]);}
function setMode(m){GMODE=m;renderGap(CASES[CUR]);}
function onSearch(v){GQ=v.toLowerCase().trim();renderBuckets(CASES[CUR]);}
function gapPass(f){
  if(GFILTER==='high'||GFILTER==='medium'||GFILTER==='low'){if(f.sev!==GFILTER)return false;}
  else if(GFILTER.startsWith('cat:')){if(f.cat!==GFILTER.slice(4))return false;}
  if(GQ){const t=(f.title+' '+f.rule+' '+(f.part||'')+' '+f.detail).toLowerCase();if(!t.includes(GQ))return false;}
  return true;
}
function renderBuckets(c){
  const items=c.gap_findings.filter(gapPass);
  let groups;
  if(GMODE==='part'&&c.multi_part){
    const order=[...c.sub_parts,'Assembly'];
    groups=order.map(p=>({key:p,label:p,items:items.filter(f=>f.part===p),accent:true})).filter(g=>g.items.length);
  }else{
    groups=[['high','High Severity'],['medium','Medium Severity'],['low','Low Severity']].map(([s,l])=>({key:s,label:l,sev:s,items:items.filter(f=>f.sev===s)})).filter(g=>g.items.length);
  }
  const bx=document.getElementById('buckets');
  if(!groups.length){bx.innerHTML='<div class="empty">No findings match.</div>';return;}
  bx.innerHTML=groups.map((g,gi)=>{
    const col=g.sev?SEV[g.sev].c:'var(--accent)';
    const pill=g.sev?sevPill(g.sev):'background:var(--accent-soft);color:var(--accent-d)';
    return `<div class="bucket ${gi>1?'closed':''}">
      <div class="bucket-h" onclick="this.parentNode.classList.toggle('closed')">
        <div class="bk-bar" style="background:${col}"></div>
        <div class="bk-title">${esc(g.label)}</div>
        <div class="bk-count" style="${pill}">${g.items.length}</div>
        <svg class="bk-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="bucket-body">${g.items.map(fitem).join('')}</div>
    </div>`;
  }).join('');
}
function fitem(f){
  const m=SEV[f.sev];
  const hist=f.hist?`<div class="histcmp">
    <div><div class="l">${esc(f.hist.label)}</div><div class="v" style="color:var(--accent-d)">${esc(f.hist.hist_val)}</div></div>
    <div><div class="l">This RFQ</div><div class="v" style="color:var(--med)">${esc(f.hist.curr_val)}</div></div>
    <div><div class="l">Projects</div><div class="v">${f.hist.projects.join(', ')}</div></div></div>`:'';
  return `<div class="fitem">
    <div class="fitem-h" onclick="this.parentNode.classList.toggle('open')">
      <span class="sevdot" style="background:${m.c}"></span>
      <span class="rcode">${f.rule}</span>
      <span class="ttl">${esc(f.title)}</span>
      ${f.part&&GMODE!=='part'?`<span class="ptag">${esc(f.part)}</span>`:''}
      <span class="imp">${esc(f.impact)}</span>
      <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
    </div>
    <div class="fitem-body">
      <div class="det">${esc(f.detail)}</div>
      <div class="fmeta">
        <div><div class="l">Severity</div><div class="v" style="color:${m.c}">${m.l}</div></div>
        <div><div class="l">Category</div><div class="v" style="text-transform:capitalize">${esc(f.cat)}</div></div>
        <div><div class="l">Impact</div><div class="v">${esc(f.impact)}</div></div>
        <div><div class="l">Evidence</div><div class="v">${esc(f.evidence)}</div></div>
      </div>
      ${hist}
      <div class="actbox"><div class="l">Recommended Action</div><p>${esc(f.action)}</p></div>
    </div>
  </div>`;
}

function renderQuote(c){
  const q=c.quote,hist=HISTORICAL.filter(h=>q.hist_match.includes(h.id)).slice(0,3),cb=q.cost_breakdown;
  const maxV=Math.max(...Object.entries(cb).filter(([k])=>k!=='total').map(([,v])=>v));
  const totalVal=q.lines.reduce((a,l)=>a+l.price*l.vol,0);
  const lines=q.lines.map(l=>`<tr><td style="color:var(--accent-d);font-weight:600;font-family:var(--mono)">${esc(l.pn)}</td><td style="color:var(--ink2)">${esc(l.name)}</td><td class="num">${l.vol.toLocaleString()}</td><td class="num">$${l.price.toFixed(2)}</td><td class="num">$${l.tooling.toLocaleString()}</td><td class="num" style="color:${l.pkg===0?'var(--high)':'var(--ink)'}">$${l.pkg.toFixed(2)}${l.pkg===0?' ⚠':''}</td><td class="num">$${l.quality.toFixed(2)}</td><td class="num" style="color:${l.margin>=15?'var(--accent-d)':l.margin>=12?'var(--med)':'var(--high)'};font-weight:600">${l.margin.toFixed(1)}%</td></tr>`).join('');
  const cbl={material:'Material',labor:'Labor',machine:'Machine',overhead:'Overhead',scrap:'Scrap',quality:'Quality / PPAP',logistics:'Logistics',packaging:'Packaging'};
  document.getElementById('p-quote').innerHTML=`
    <div class="card qhead">
      <div class="qk"><div class="l">Version</div><div class="v">${esc(q.version)}</div></div><div class="qsep"></div>
      <div class="qk"><div class="l">Prepared By</div><div class="v">${esc(q.prepared_by)}</div></div><div class="qsep"></div>
      <div class="qk"><div class="l">Tooling (est.)</div><div class="v">$${q.total_tooling.toLocaleString()}</div></div><div class="qsep"></div>
      <div class="qk"><div class="l">Est. Annual Rev.</div><div class="v big">$${Math.round(totalVal).toLocaleString()}</div></div><div class="qsep"></div>
      <div class="qk"><div class="l">Risk</div><div class="v big" style="color:${riskColor(q.risk_score)}">${q.risk_score}/100</div></div>
    </div>
    <div class="sec-lab">Quote Line Items${q.lines.length>1?' — '+q.lines.length+' sub-parts':''}</div>
    <div class="card" style="overflow-x:auto"><table class="tbl r"><thead><tr><th>Part No.</th><th>Description</th><th>Volume</th><th>Unit Price</th><th>Tooling</th><th>Pkg/pc</th><th>Qual/pc</th><th>Margin</th></tr></thead><tbody>${lines}</tbody></table></div>
    <div class="cols2" style="margin-top:15px">
      <div class="card"><div class="card-h">Cost Breakdown — USD/pc${q.lines.length>1?' (assembly)':''}</div><div style="padding:14px 18px">
        ${Object.entries(cbl).map(([k,lab])=>{const v=cb[k];const w=(k==='packaging'&&v===0)||(k==='logistics'&&v===0&&c.incoterm.startsWith('DDP'));return `<div class="cb-row"><span class="l">${lab}</span><span class="track"><i style="width:${Math.min(100,v/maxV*100)}%;background:${w?'var(--high)':'var(--accent)'}"></i></span><span class="v" style="color:${w?'var(--high)':'var(--ink)'}">${w?'⚠':''}$${v.toFixed(2)}</span></div>`;}).join('')}
        <div class="cb-row" style="font-weight:700"><span class="l">Total Cost</span><span class="track"></span><span class="v">$${cb.total.toFixed(2)}</span></div>
      </div></div>
      <div class="card"><div class="card-h">Historical Benchmark — ${q.hist_match.length} matched</div><div style="padding:14px 18px">
        ${hist.map(h=>`<div class="bm-row"><span class="pj">${h.id}</span><span class="meta">${esc(h.pn)} · ${esc(h.material)} · ${h.vol.toLocaleString()} pcs</span><span class="pr">$${h.price.toFixed(2)}</span><span class="bm-out ${h.award==='Won'?'won':'lost'}">${h.award}</span></div>`).join('')}
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:13px">
          <div><div class="l" style="font-size:10px;text-transform:uppercase;color:var(--ink3);margin-bottom:4px">Hist. Price Band</div><div class="num" style="font-size:16px;font-weight:700;color:var(--accent-d)">$${q.hist_price_band[0].toFixed(2)} – $${q.hist_price_band[1].toFixed(2)}</div></div>
          <div><div class="l" style="font-size:10px;text-transform:uppercase;color:var(--ink3);margin-bottom:4px">Hist. Tooling Band</div><div class="num" style="font-size:16px;font-weight:700;color:var(--accent-d)">$${(q.hist_tooling_band[0]/1000).toFixed(0)}K – $${(q.hist_tooling_band[1]/1000).toFixed(0)}K</div></div>
        </div>
        ${c.risk_score>=60?`<div style="margin-top:13px;background:var(--high-soft);border:1px solid #e6c9c4;border-radius:8px;padding:12px 14px;font-size:13px;color:var(--ink2)"><b style="color:var(--high)">Risk flag</b> — ${c.completeness==='incomplete'?'Quote blocked — missing specs must be resolved first. Benchmark is reference only.':'Multiple cost gaps detected. Corrected cost is materially higher than the current draft. Management review required.'}</div>`:''}
      </div></div>
    </div>`;
}

const NOTES={
  A:[{sev:'medium',ti:'Annual price reduction',tx:'2% annual reduction after Year 1 must be modeled. At 180K units and $4.08 launch, ~5-year cumulative impact ≈ $160K.'},
     {sev:'low',ti:'Package complete',tx:'All required documents received and parsed. Minor packaging cost gap (RULE_019) resolvable before release.'}],
  B:[{sev:'high',ti:'Incomplete package — quote blocked',tx:'Packaging spec and DV/PV test standard both missing. Two blocking gaps must be resolved before release.'},
     {sev:'medium',ti:'Appearance approval timeline risk',tx:'Appearance sample approval required prior to PPAP — not in the current program plan; may impact SOP.'}],
  C:[{sev:'high',ti:'High risk — management review required',tx:'Risk 89/100. 14 rules triggered. DDP Monterrey, Net 120, PPAP L5, supplier gauges and 4% APD all above family norm.'},
     {sev:'high',ti:'DDP Monterrey logistics gap',tx:'Logistics in template is at FOB rate. DDP requires a full rebuild: freight, customs, brokerage, volatility buffer.'},
     {sev:'high',ti:'4% APD over program life',tx:'At $6.18 launch, year-5 effective ≈ $5.05 after 4% compounding. Validate margin floor at year 5, not just launch.'}],
  D:[{sev:'high',ti:'Critical multi-part RFQ — 46 open gaps',tx:'Risk 94/100. Aluminium assembly with 6 sub-parts. Weld spec, leak-test standard and packaging spec all missing; capacity flagged below volume.'},
     {sev:'high',ti:'No historical cost anchor',tx:'AA5754 pan and AA6082 cross member are new materials/processes vs the steel family. Cost must be built bottom-up.'},
     {sev:'high',ti:'DDP Stuttgart + Net 120 on high-value assembly',tx:'Intercontinental DDP on a bulky aluminium tray plus Net 120 on ~$1.7M+ annual revenue — material logistics and financing exposure.'}]
};

/* ── theme toggle ── */
(function(){
  var ls=(window&&window.localStorage)?window.localStorage:null;
  var mm=(window&&window.matchMedia)?window.matchMedia('(prefers-color-scheme:dark)'):null;
  var saved=ls?ls.getItem('sleek-theme'):null;
  if(saved==='dark'||saved==='light')document.documentElement.setAttribute('data-theme',saved);
  function effective(){
    var a=document.documentElement.getAttribute('data-theme');
    if(a)return a;
    return (mm&&mm.matches)?'dark':'light';
  }
  var btn=document.getElementById('themeToggle');
  if(btn)btn.addEventListener('click',function(){
    var next=effective()==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    if(ls)ls.setItem('sleek-theme',next);
  });
})();

renderCaseSel();
renderAll();
</script>
