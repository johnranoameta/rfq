<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RFQ Assistant · Atlas</title>
<style>
/* ════════ ATLAS — Enterprise SaaS · light neutral · steel-blue accent ════════ */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --raised:#f8fafc; --hover:#f1f5f9;
  --line:#e4e8ed; --line2:#d3d9e0;
  --ink:#1b2430; --ink2:#5a6573; --ink3:#8b95a3;
  --accent:#2f6fb0; --accent-soft:#eaf2fa; --accent-line:#bcd6ee;
  --ok:#2f7d4f; --ok-soft:#edf6f0;
  --warn:#b07b2f; --warn-soft:#fbf4e9;
  --bad:#a8443a; --bad-soft:#fbeeec;
  --low:#5a6573; --low-soft:#eef1f4;
  --r:10px; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --shadow:0 1px 2px rgba(20,30,45,.04),0 2px 8px rgba(20,30,45,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* App frame */
.app{display:flex;height:100vh}
/* Left icon rail */
.rail{width:64px;min-width:64px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px}
.rail .logo{width:36px;height:36px;border-radius:9px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;letter-spacing:-.02em;margin-bottom:10px}
.rail .ri{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--ink3);cursor:pointer}
.rail .ri svg{width:20px;height:20px}
.rail .ri.on{background:var(--accent-soft);color:var(--accent)}
.rail .ri:hover{background:var(--hover);color:var(--ink)}
.rail .sp{flex:1}

/* Cases column */
.cases{width:284px;min-width:284px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.cases-h{padding:18px 18px 12px}
.cases-h .t{font-size:16px;font-weight:700;letter-spacing:-.01em}
.cases-h .s{font-size:12px;color:var(--ink3);margin-top:2px}
.cases-list{flex:1;overflow-y:auto;padding:4px 10px 14px}
.ci{padding:12px 12px;border-radius:var(--r);cursor:pointer;border:1px solid transparent;margin-bottom:4px}
.ci:hover{background:var(--hover)}
.ci.on{background:var(--accent-soft);border-color:var(--accent-line)}
.ci-top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.ci-code{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:600}
.ci-risk{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:700;padding:1px 8px;border-radius:20px}
.ci-name{font-size:13.5px;font-weight:600;line-height:1.35}
.ci-cust{font-size:12px;color:var(--ink3);margin-top:3px}
.hist-box{margin:6px 12px 14px;padding:14px;border-top:1px solid var(--line)}
.hist-box .lab{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px}
.hist-box .row{font-size:12.5px;color:var(--ink2);line-height:1.7}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:64px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 24px;flex-shrink:0}
.tb-title{font-size:16px;font-weight:700;letter-spacing:-.01em}
.tb-sub{font-family:var(--mono);font-size:12px;color:var(--ink3);margin-top:1px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.kv{text-align:right}
.kv .l{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3)}
.kv .v{font-family:var(--mono);font-size:15px;font-weight:700}
.chip{font-size:11px;font-weight:600;padding:5px 12px;border-radius:20px}
.btn{font-size:13px;font-weight:600;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
.btn.ghost{background:#fff;color:var(--accent)}

.tabs{display:flex;gap:4px;padding:10px 24px 0;background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0}
.tab{padding:10px 16px;font-size:13.5px;font-weight:600;color:var(--ink2);cursor:pointer;border-radius:8px 8px 0 0;border-bottom:2px solid transparent;display:flex;align-items:center;gap:8px}
.tab:hover{color:var(--ink);background:var(--raised)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab .cnt{font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:20px;background:var(--hover);color:var(--ink2)}
.tab.on .cnt{background:var(--accent-soft);color:var(--accent)}

.content{flex:1;overflow-y:auto;padding:24px;min-width:0}
.panel{display:none}.panel.on{display:block}
.maxw{max-width:1100px}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{padding:14px 18px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700}
.sec-lab{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:24px 0 12px}
.sec-lab:first-child{margin-top:0}

/* stat cards */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.stat .l{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
.stat .v{font-size:28px;font-weight:700;margin-top:8px;letter-spacing:-.02em}
.stat .sub{font-size:12px;color:var(--ink2);margin-top:6px}
.bar{height:6px;border-radius:6px;background:var(--hover);overflow:hidden;margin-top:10px}
.bar > i{display:block;height:100%;border-radius:6px;background:var(--accent)}

/* workflow */
.wf{display:flex;align-items:center;gap:0;padding:18px;flex-wrap:wrap}
.wf-s{display:flex;align-items:center;gap:9px}
.wf-n{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;border:1.5px solid var(--line2);color:var(--ink3);background:#fff}
.wf-l{font-size:12.5px;font-weight:600;color:var(--ink3);white-space:nowrap}
.wf-line{width:34px;height:2px;background:var(--line2);margin:0 10px}
.wf-done .wf-n{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.wf-done .wf-l{color:var(--ink2)}.wf-done + .wf-line,.wf-line.done{background:var(--ok)}
.wf-active .wf-n{background:var(--accent);border-color:var(--accent);color:#fff}
.wf-active .wf-l{color:var(--accent)}

/* info grid */
.ig{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.if{background:var(--surface);padding:13px 16px}
.if .l{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.if .v{font-size:13.5px;font-weight:600}
.if .v.warn{color:var(--warn)}.if .v.bad{color:var(--bad)}.if .v.ok{color:var(--ok)}

/* notes */
.note{display:flex;gap:12px;padding:13px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);margin-bottom:10px}
.note .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0}
.note .b{flex:1}
.note .ti{font-weight:700;font-size:13.5px}
.note .tx{font-size:13px;color:var(--ink2);margin-top:3px;line-height:1.55}
.note .sv{font-family:var(--mono);font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;align-self:flex-start}

/* tables */
table.tbl{width:100%;border-collapse:collapse;background:var(--surface)}
.tbl th{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);text-align:left;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--raised)}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--raised)}
.tbl.r th,.tbl.r td{text-align:right}.tbl.r th:first-child,.tbl.r td:first-child,.tbl.r th:nth-child(2),.tbl.r td:nth-child(2){text-align:left}
.dtag{font-family:var(--mono);font-size:11px;padding:2px 9px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.pst{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600}
.pst .d{width:7px;height:7px;border-radius:50%}
.pst.ok{color:var(--ok)}.pst.ok .d{background:var(--ok)}
.pst.miss{color:var(--bad)}.pst.miss .d{background:var(--bad)}
.minibar{display:inline-block;width:60px;height:5px;border-radius:3px;background:var(--hover);overflow:hidden;vertical-align:middle;margin-left:7px}
.minibar > i{display:block;height:100%}

/* flags */
.flags{display:flex;gap:8px;flex-wrap:wrap;padding:4px 0}
.flag{font-size:12px;font-weight:600;padding:4px 11px;border-radius:20px;border:1px solid var(--line2)}
.flag.y{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.flag.n{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.flag.w{background:var(--warn-soft);color:var(--warn);border-color:transparent}

/* ════════ GAP ANALYSIS — accordion grouped by severity ════════ */
.gap-top{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.sev-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);border-left:3px solid var(--line2)}
.sev-card.crit{border-left-color:var(--bad)}.sev-card.high{border-left-color:var(--bad)}
.sev-card.med{border-left-color:var(--warn)}.sev-card.low{border-left-color:var(--low)}
.sev-card .n{font-size:26px;font-weight:700;letter-spacing:-.02em}
.sev-card .l{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin-top:2px}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line2);border-radius:8px;font-size:13px;font-family:var(--sans);background:var(--surface)}
.search svg{position:absolute;left:10px;top:9px;width:16px;height:16px;color:var(--ink3)}
.fchip{font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);color:var(--ink2);cursor:pointer}
.fchip:hover{border-color:var(--accent-line);color:var(--ink)}
.fchip.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.seg{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{padding:7px 12px;font-size:12.5px;font-weight:600;border:none;background:var(--surface);color:var(--ink2);cursor:pointer;border-right:1px solid var(--line2)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--accent);color:#fff}

.grp{margin-bottom:16px}
.grp-h{display:flex;align-items:center;gap:10px;padding:8px 4px;cursor:pointer;user-select:none}
.grp-h .chev{transition:transform .15s;color:var(--ink3)}
.grp.closed .chev{transform:rotate(-90deg)}
.grp.closed .grp-body{display:none}
.grp-title{font-size:13px;font-weight:700}
.grp-pill{font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px}
.grp-sub{font-size:12px;color:var(--ink3);margin-left:auto}

.acc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden;box-shadow:var(--shadow)}
.acc-h{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer}
.acc-h:hover{background:var(--raised)}
.acc .sevdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.acc .rcode{font-family:var(--mono);font-size:11px;color:var(--ink3);background:var(--raised);border:1px solid var(--line);padding:2px 8px;border-radius:6px;flex-shrink:0}
.acc .ttl{font-size:13.5px;font-weight:600;flex:1;min-width:0}
.acc .part-tag{font-family:var(--mono);font-size:11px;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:6px;flex-shrink:0}
.acc .cat{font-size:12px;color:var(--ink3);text-transform:capitalize;flex-shrink:0}
.acc .imp{font-size:12px;color:var(--bad);font-weight:600;flex-shrink:0;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc .chev{color:var(--ink3);transition:transform .15s;flex-shrink:0}
.acc.open .chev{transform:rotate(180deg)}
.acc-body{display:none;padding:0 16px 16px 47px;border-top:1px solid var(--line)}
.acc.open .acc-body{display:block}
.acc-body .det{font-size:13px;color:var(--ink2);line-height:1.65;margin:14px 0 12px}
.acc-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:12px}
.acc-meta .l{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);margin-bottom:3px}
.acc-meta .v{font-size:12.5px;font-weight:600;font-family:var(--mono)}
.action-box{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:8px;padding:12px 14px}
.action-box .l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:5px}
.action-box p{font-size:13px;color:var(--ink2);line-height:1.55}
.hist-cmp{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.hist-cmp > div{background:var(--surface);padding:10px 12px}
.hist-cmp .l{font-size:10px;text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
.hist-cmp .v{font-size:12.5px;font-weight:700;font-family:var(--mono)}
.statussel{font-size:12px;padding:5px 8px;border:1px solid var(--line2);border-radius:6px;background:var(--surface);color:var(--ink2);flex-shrink:0}

/* quote */
.qhead{display:flex;gap:24px;align-items:center;flex-wrap:wrap;padding:18px;margin-bottom:18px}
.qhead .qk .l{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
.qhead .qk .v{font-family:var(--mono);font-size:15px;font-weight:700;margin-top:3px}
.qhead .qk .v.big{font-size:20px;color:var(--accent)}
.qsep{width:1px;height:40px;background:var(--line)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cb-row{display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.cb-row:last-child{border-bottom:none}
.cb-row .l{color:var(--ink2);width:130px}
.cb-row .track{flex:1;height:5px;border-radius:3px;background:var(--hover);overflow:hidden}
.cb-row .track > i{display:block;height:100%;background:var(--accent)}
.cb-row .v{font-family:var(--mono);font-weight:600;width:70px;text-align:right}
.bm-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.bm-row:last-child{border-bottom:none}
.bm-row .pj{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:600}
.bm-row .meta{flex:1;color:var(--ink2);font-size:12.5px}
.bm-row .pr{font-family:var(--mono);font-weight:700}
.bm-out{font-family:var(--mono);font-size:11px;padding:2px 9px;border-radius:20px}
.won{background:var(--ok-soft);color:var(--ok)}.lost{background:var(--bad-soft);color:var(--bad)}

::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#cfd6dd;border-radius:6px;border:2px solid var(--bg)}
</style>
</head>
<body>
<div class="app">

  <!-- ICON RAIL -->
  <div class="rail">
    <div class="logo">R</div>
    <div class="ri on" title="RFQ Cases"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v16"/></svg></div>
    <div class="ri" title="Knowledge Base"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2z"/><path d="M8 7h6M8 11h6"/></svg></div>
    <div class="ri" title="Analytics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg></div>
    <div class="sp"></div>
    <div class="ri" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-2.81 1.17V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 8 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15H4.5a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 6 9.4l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 12 4.6V4.5a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 2.81 1.17l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 8z"/></svg></div>
  </div>

  <!-- CASES -->
  <div class="cases">
    <div class="cases-h"><div class="t">RFQ Cases</div><div class="s">Active quoting queue</div></div>
    <div class="cases-list" id="cases-list"></div>
    <div class="hist-box">
      <div class="lab">Historical Reference</div>
      <div class="row">18 submitted projects<br>14 Won · 4 Lost<br><span style="color:var(--ink3);font-family:var(--mono);font-size:11px">NorthBridge · SPCC/SPHC/SPFC + AA family</span></div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div>
        <div class="tb-title" id="tb-title">—</div>
        <div class="tb-sub" id="tb-sub">—</div>
      </div>
      <div class="tb-right">
        <div class="kv"><div class="l">Risk Score</div><div class="v" id="tb-risk">—</div></div>
        <span class="chip" id="tb-status">—</span>
        <button class="btn ghost">Export</button>
        <button class="btn">Advance</button>
      </div>
    </div>

    <div class="tabs" id="tabs">
      <div class="tab on" data-t="overview" onclick="switchTab('overview',this)">Overview</div>
      <div class="tab" data-t="documents" onclick="switchTab('documents',this)">Documents <span class="cnt" id="cnt-doc">—</span></div>
      <div class="tab" data-t="parts" onclick="switchTab('parts',this)">Part Detail</div>
      <div class="tab" data-t="gap" onclick="switchTab('gap',this)">Gap Analysis <span class="cnt" id="cnt-gap">—</span></div>
      <div class="tab" data-t="quote" onclick="switchTab('quote',this)">Quote &amp; Benchmark</div>
    </div>

    <div class="content">
      <div class="panel on" id="p-overview"></div>
      <div class="panel" id="p-documents"></div>
      <div class="panel" id="p-parts"></div>
      <div class="panel" id="p-gap"></div>
      <div class="panel" id="p-quote"></div>
    </div>
  </div>
</div>

<script>
/* ═══════ DATA (inlined) ═══════ */
/* ═══════════════════════════════════════════════════════════════════════
   RFQ ASSISTANT — CANONICAL MOCKUP DATA  (shared across all 5 designs)
   Inline this whole block into each mockup so every file is self-contained.
   Cases A/B/C carried from the v2.1 mock; Case D added as a 45+ gap stress test.
═══════════════════════════════════════════════════════════════════════ */

const RULE_CATALOG = {
  RULE_001:{name:"Missing packaging specification",cat:"completeness",sev:"high"},
  RULE_002:{name:"Missing test standard",cat:"completeness",sev:"high"},
  RULE_003:{name:"PPAP level above historical baseline",cat:"quality",sev:"high"},
  RULE_004:{name:"General tolerance tighter than historical family",cat:"technical",sev:"high"},
  RULE_005:{name:"Critical tolerance at or below 0.03 mm",cat:"technical",sev:"high"},
  RULE_007:{name:"Supplier-funded gauges required",cat:"quality",sev:"high"},
  RULE_008:{name:"100% appearance inspection required",cat:"quality",sev:"high"},
  RULE_009:{name:"Payment terms extended beyond historical norm",cat:"commercial",sev:"medium"},

/* Convenience: doc type labels + tag keys shared by all designs */
const DOC_TYPE_LABEL = {rfq:"RFQ Main",cost:"Cost Template",draw:"Drawing",pkg:"Packaging",test:"Test Spec",q:"Questionnaire"};
const CASE_ORDER = ["A","B","C","D"];

/* ═══════ ATLAS RENDER ENGINE ═══════ */
let CUR = 'A';
const esc = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const sevMeta = {high:{l:'High',c:'var(--bad)',soft:'var(--bad-soft)',pill:'background:var(--bad-soft);color:var(--bad)'},
  medium:{l:'Medium',c:'var(--warn)',soft:'var(--warn-soft)',pill:'background:var(--warn-soft);color:var(--warn)'},
  low:{l:'Low',c:'var(--low)',soft:'var(--low-soft)',pill:'background:var(--low-soft);color:var(--low)'}};
const riskColor = s => s>=80?'var(--bad)':s>=60?'var(--warn)':s>=40?'var(--warn)':'var(--ok)';

function renderCasesList(){
  document.getElementById('cases-list').innerHTML = CASE_ORDER.map(k=>{
    const c=CASES[k];
    const rc=riskColor(c.risk_score);
    return `<div class="ci ${k===CUR?'on':''}" onclick="selectCase('${k}',this)">
      <div class="ci-top">
        <span class="ci-code">${esc(c.id)}</span>
        <span class="ci-risk num" style="background:${c.risk_score>=60?'var(--bad-soft)':'var(--ok-soft)'};color:${rc}">${c.risk_score}</span>
      </div>
      <div class="ci-name">${esc(c.title)}</div>
      <div class="ci-cust">${esc(c.program)} · ${c.gap_findings.length} findings</div>
    </div>`;
  }).join('');
}

function selectCase(k,el){
  CUR=k;
  document.querySelectorAll('.ci').forEach(c=>c.classList.remove('on'));
  if(el)el.classList.add('on');
  renderAll();
}
function switchTab(t,el){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  document.getElementById('p-'+t).classList.add('on');
  el.classList.add('on');
}

function renderAll(){
  const c=CASES[CUR];
  // topbar
  document.getElementById('tb-title').textContent=c.title;
  document.getElementById('tb-sub').textContent=c.rfq_num+' · '+c.part_number+' · '+c.customer;
  const tr=document.getElementById('tb-risk'); tr.textContent=c.risk_score+'/100'; tr.style.color=riskColor(c.risk_score);
  const ts=document.getElementById('tb-status');
  ts.textContent=c.status_label;
  const blocked = c.completeness==='incomplete' || c.risk_score>=80;
  ts.style.cssText = blocked ? 'background:var(--bad-soft);color:var(--bad)' : 'background:var(--ok-soft);color:var(--ok)';
  // tab counts
  const miss=c.docs.filter(d=>d.status==='miss').length;
  document.getElementById('cnt-doc').textContent=c.docs.length+(miss?' · '+miss+' missing':'');
  document.getElementById('cnt-gap').textContent=c.gap_findings.length;
  renderOverview(c); renderDocuments(c); renderParts(c); renderGap(c); renderQuote(c);
}

function renderOverview(c){
  const miss=c.docs.filter(d=>d.status==='miss').length;
  const pct=Math.round((c.docs.length-miss)/c.docs.length*100);
  const hi=c.gap_findings.filter(f=>f.sev==='high').length;
  const md=c.gap_findings.filter(f=>f.sev==='medium').length;
  const steps=[['Upload','done'],['Parse','done'],['Normalize','done'],['Gap Review','active'],['Quote','idle'],['Submit','idle'],['Outcome','idle']];
  const wf=steps.map((s,i)=>`<div class="wf-s wf-${s[1]}"><div class="wf-n">${i+1}</div><div class="wf-l">${s[0]}</div></div>${i<steps.length-1?`<div class="wf-line ${s[1]==='done'?'done':''}"></div>`:''}`).join('');
  const notes = NOTES[CUR]||[];
  document.getElementById('p-overview').innerHTML=`
    <div class="card" style="margin-bottom:18px"><div class="wf">${wf}</div></div>
    <div class="stats">
      <div class="stat"><div class="l">Completeness</div><div class="v">${pct}%</div><div class="bar"><i style="width:${pct}%;background:${pct>=85?'var(--ok)':pct>=60?'var(--warn)':'var(--bad)'}"></i></div><div class="sub">${c.docs.length-miss} of ${c.docs.length} docs parsed${miss?' · '+miss+' missing':''}</div></div>
      <div class="stat"><div class="l">Open Findings</div><div class="v">${c.gap_findings.length}</div><div class="sub">${hi} high · ${md} medium</div></div>
      <div class="stat"><div class="l">Risk Score</div><div class="v" style="color:${riskColor(c.risk_score)}">${c.risk_score}<span style="font-size:15px;color:var(--ink3)">/100</span></div><div class="sub">${c.risk_score>=80?'Management review required':c.risk_score>=60?'Elevated — resolve gaps':'Low — minor items'}</div></div>
      <div class="stat"><div class="l">Rules Triggered</div><div class="v">${c.triggered_rules.length}</div><div class="sub">of ${Object.keys(RULE_CATALOG).length} in catalog</div></div>
    </div>
    <div class="sec-lab">RFQ Header — Extracted Terms</div>
    <div class="ig">
      ${ifield('Customer',c.customer)}${ifield('Program',c.program)}${ifield('Part Number',c.part_number)}${ifield('SOP Date',c.sop)}
      ${ifield('Annual Volume',c.annual_vol.toLocaleString()+' pcs')}${ifield('Material',c.material+' · '+c.thickness+' mm')}
      ${ifield('PPAP Level','L'+c.ppap,c.ppap>=5?'bad':c.ppap>=4?'warn':'')}${ifield('Incoterm',c.incoterm,c.incoterm.startsWith('DDP')?'warn':'')}
      ${ifield('Payment',c.payment,c.payment.includes('120')?'bad':c.payment.includes('75')?'warn':'')}${ifield('Annual Price Down',c.apd+'%/yr',c.apd>=4?'bad':c.apd>=3?'warn':'')}
      ${ifield('Tolerance',c.tolerance,c.tolerance.includes('0.03')?'warn':'')}${ifield('Cpk Target',c.cpk)}
    </div>
    <div class="sec-lab">Extracted Risk Notes</div>
    ${notes.map(n=>{const m=sevMeta[n.sev]||sevMeta.medium;return `<div class="note"><div class="dot" style="background:${m.c}"></div><div class="b"><div class="ti">${esc(n.ti)}</div><div class="tx">${esc(n.tx)}</div></div><span class="sv" style="${m.pill}">${m.l.toUpperCase()}</span></div>`}).join('')}
  `;
}
function ifield(l,v,cls){return `<div class="if"><div class="l">${l}</div><div class="v ${cls||''}">${esc(v)}</div></div>`;}

function renderDocuments(c){
  const miss=c.docs.filter(d=>d.status==='miss').length;
  document.getElementById('p-documents').innerHTML=`
    <div class="sec-lab">Package Files — ${c.docs.length} Documents${miss?' · '+miss+' missing':''}</div>
    <div class="card" style="overflow:hidden">
      <table class="tbl"><thead><tr><th>File Name</th><th>Type</th><th>Status</th><th>Confidence</th><th>Notes</th></tr></thead><tbody>
      ${c.docs.map(d=>{
        const conf = d.conf!=null ? `<span class="num" style="color:${d.conf>=0.9?'var(--ok)':'var(--warn)'};font-weight:600">${d.conf.toFixed(2)}</span><span class="minibar"><i style="width:${d.conf*100}%;background:${d.conf>=0.9?'var(--ok)':'var(--warn)'}"></i></span>` : '<span style="color:var(--ink3)">—</span>';
        return `<tr>
          <td style="font-weight:600;color:${d.status==='miss'?'var(--bad)':'var(--ink)'}">${d.status==='miss'?'⚠ ':''}${esc(d.name)}</td>
          <td><span class="dtag">${DOC_TYPE_LABEL[d.type]||d.type}</span></td>
          <td><span class="pst ${d.status==='ok'?'ok':'miss'}"><span class="d"></span>${d.status==='ok'?'Parsed':'Missing'}</span></td>

          <td style="color:var(--ink2);font-size:12.5px">${esc(d.note)}</td>
        </tr>`;}).join('')}
      </tbody></table>
    </div>
    <div class="card" style="margin-top:14px;padding:14px 18px;font-size:13px;color:var(--ink2)">
      <b style="color:${miss>=2?'var(--bad)':miss===1?'var(--warn)':'var(--ok)'}">Completeness risk: ${miss>=2?'HIGH':miss===1?'MEDIUM':'LOW'}</b> — ${miss===0?'All referenced documents received and parsed.':miss+' referenced document'+(miss>1?'s are':' is')+' missing. '+(miss>=2?'Quote release is blocked until resolved or assumptions are documented.':'Address before final release.')}
    </div>`;
}

        <div class="sec-lab" style="margin:0 0 10px">Compliance Flags</div>
        <div class="flags">
          <span class="flag y">PPAP L${c.ppap}</span>
          <span class="flag ${c.completeness==='complete'?'y':'n'}">Packaging Spec ${c.completeness==='complete'?'✓':'⚠ Missing'}</span>
          <span class="flag ${c.triggered_rules.includes('RULE_002')?'n':'y'}">Test Standard ${c.triggered_rules.includes('RULE_002')?'⚠ Missing':'✓'}</span>
          ${c.supplier_funded_gauges?'<span class="flag w">Supplier-Funded Gauges</span>':''}
          ${c.incoterm.startsWith('DDP')?'<span class="flag w">DDP — Supplier Freight</span>':''}
          <span class="flag ${c.apd>=4?'n':c.apd>=3?'w':'y'}">${c.apd}% APD</span>
          <span class="flag ${c.payment.includes('120')?'n':c.payment.includes('60')||c.payment.includes('75')?'y':'w'}">${c.payment}</span>
        </div>
      </div>
    </div>`;
}

/* ── GAP ANALYSIS: accordion grouped by severity ── */
let GAP_GROUPMODE='sev';
function renderGap(c){
  const f=c.gap_findings;
  const cnt=s=>f.filter(x=>x.sev===s).length;
  const cats=[...new Set(f.map(x=>x.cat))];
  const isMulti=c.multi_part;
  document.getElementById('p-gap').innerHTML=`
    <div class="gap-top">
      <div class="sev-card high"><div class="n">${cnt('high')}</div><div class="l">High</div></div>
      <div class="sev-card med"><div class="n">${cnt('medium')}</div><div class="l">Medium</div></div>
      <div class="sev-card low"><div class="n">${cnt('low')}</div><div class="l">Low</div></div>
      <div class="sev-card"><div class="n">${f.length}</div><div class="l">Total</div></div>
    </div>
    <div class="toolbar">
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg><input id="gap-search" placeholder="Search findings, rules, parts…" oninput="filterGap()"></div>
      <div class="fchip on" data-f="all" onclick="setFilter(this)">All</div>
      <div class="fchip" data-f="high" onclick="setFilter(this)">High</div>
      <div class="fchip" data-f="medium" onclick="setFilter(this)">Medium</div>
      <div class="fchip" data-f="low" onclick="setFilter(this)">Low</div>
      ${cats.map(ct=>`<div class="fchip" data-f="cat:${ct}" onclick="setFilter(this)">${ct[0].toUpperCase()+ct.slice(1)}</div>`).join('')}
      ${isMulti?`<div class="seg" style="margin-left:auto"><button class="${GAP_GROUPMODE==='sev'?'on':''}" onclick="setGroup('sev')">By severity</button><button class="${GAP_GROUPMODE==='part'?'on':''}" onclick="setGroup('part')">By sub-part</button></div>`:''}
    </div>
    <div id="gap-groups">${renderGroups(c)}</div>`;
}
function setGroup(m){GAP_GROUPMODE=m;renderGap(CASES[CUR]);}
function renderGroups(c){
  const f=c.gap_findings;
  let groups;
  if(GAP_GROUPMODE==='part' && c.multi_part){
    const order=[...c.sub_parts,'Assembly'];
    groups=order.map(p=>({key:p,label:p,items:f.filter(x=>x.part===p)})).filter(g=>g.items.length);
  } else {
    groups=[['high','High severity'],['medium','Medium severity'],['low','Low severity']]
      .map(([s,l])=>({key:s,label:l,items:f.filter(x=>x.sev===s)})).filter(g=>g.items.length);
  }
  return groups.map(g=>{
    const m=GAP_GROUPMODE==='part'?null:sevMeta[g.key];
    const pill = m?`style="${m.pill}"`:`style="background:var(--accent-soft);color:var(--accent)"`;
    return `<div class="grp" data-grp="${esc(g.key)}">
      <div class="grp-h" onclick="this.parentNode.classList.toggle('closed')">
        <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
        <span class="grp-title">${esc(g.label)}</span>
        <span class="grp-pill" ${pill}>${g.items.length}</span>
      </div>
      <div class="grp-body">${g.items.map(accItem).join('')}</div>
    </div>`;
  }).join('');
}
function accItem(f){
  const m=sevMeta[f.sev]||sevMeta.medium;
  const hist=f.hist?`<div class="hist-cmp">
    <div><div class="l">${esc(f.hist.label)}</div><div class="v" style="color:var(--ok)">${esc(f.hist.hist_val)}</div></div>
    <div><div class="l">This RFQ</div><div class="v" style="color:var(--warn)">${esc(f.hist.curr_val)}</div></div>
    <div><div class="l">Projects</div><div class="v">${f.hist.projects.join(', ')}</div></div>
  </div>`:'';
  return `<div class="acc" data-sev="${f.sev}" data-cat="${f.cat}" data-txt="${esc((f.title+' '+f.rule+' '+(f.part||'')+' '+f.detail).toLowerCase())}">
    <div class="acc-h" onclick="this.parentNode.classList.toggle('open')">
      <span class="sevdot" style="background:${m.c}"></span>
      <span class="rcode">${f.rule}</span>
      <span class="ttl">${esc(f.title)}</span>
      ${f.part?`<span class="part-tag">${esc(f.part)}</span>`:''}
      <span class="cat">${esc(f.cat)}</span>
      <span class="imp">${esc(f.impact)}</span>
      <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
    </div>
    <div class="acc-body">
      <div class="det">${esc(f.detail)}</div>
      <div class="acc-meta">
        <div><div class="l">Severity</div><div class="v" style="color:${m.c}">${m.l}</div></div>
        <div><div class="l">Category</div><div class="v" style="text-transform:capitalize">${esc(f.cat)}</div></div>
        <div><div class="l">Impact</div><div class="v">${esc(f.impact)}</div></div>
        <div><div class="l">Evidence</div><div class="v">${esc(f.evidence)}</div></div>
      </div>
      ${hist}
      <div class="action-box"><div class="l">Recommended Action</div><p>${esc(f.action)}</p></div>
    </div>
  </div>`;
}
let GAP_FILTER='all';
function setFilter(el){GAP_FILTER=el.dataset.f;document.querySelectorAll('.fchip').forEach(c=>c.classList.remove('on'));el.classList.add('on');filterGap();}
function filterGap(){
  const q=(document.getElementById('gap-search').value||'').toLowerCase().trim();
  document.querySelectorAll('#gap-groups .acc').forEach(a=>{
    let ok=true;
    if(GAP_FILTER==='high'||GAP_FILTER==='medium'||GAP_FILTER==='low')ok=a.dataset.sev===GAP_FILTER;
    else if(GAP_FILTER.startsWith('cat:'))ok=a.dataset.cat===GAP_FILTER.slice(4);
    if(ok&&q)ok=a.dataset.txt.includes(q);
    a.style.display=ok?'':'none';
  });
  document.querySelectorAll('#gap-groups .grp').forEach(g=>{
    const vis=[...g.querySelectorAll('.acc')].some(a=>a.style.display!=='none');
    g.style.display=vis?'':'none';
  });
}

function renderQuote(c){
  const q=c.quote, hist=HISTORICAL.filter(h=>q.hist_match.includes(h.id)).slice(0,3);
  const cb=q.cost_breakdown, maxV=Math.max(...Object.values(cb).filter((v,i)=>Object.keys(cb)[i]!=='total'));
  const totalVal=q.lines.reduce((a,l)=>a+l.price*l.vol,0);
  const lineRows=q.lines.map(l=>`<tr>
    <td style="color:var(--accent);font-weight:600;font-family:var(--mono)">${esc(l.pn)}</td>
    <td style="color:var(--ink2)">${esc(l.name)}</td>
    <td class="num">${l.vol.toLocaleString()}</td>
    <td class="num">$${l.price.toFixed(2)}</td>
    <td class="num">$${l.tooling.toLocaleString()}</td>
    <td class="num" style="color:${l.pkg===0?'var(--bad)':'var(--ink)'}">$${l.pkg.toFixed(2)}${l.pkg===0?' ⚠':''}</td>
    <td class="num">$${l.quality.toFixed(2)}</td>
    <td class="num" style="color:${l.margin>=15?'var(--ok)':l.margin>=12?'var(--warn)':'var(--bad)'};font-weight:600">${l.margin.toFixed(1)}%</td>
  </tr>`).join('');
  const cbLabels={material:'Material',labor:'Labor',machine:'Machine',overhead:'Overhead',scrap:'Scrap',quality:'Quality / PPAP',logistics:'Logistics',packaging:'Packaging'};
  document.getElementById('p-quote').innerHTML=`
    <div class="card qhead">
      <div class="qk"><div class="l">Version</div><div class="v">${esc(q.version)}</div></div><div class="qsep"></div>
      <div class="qk"><div class="l">Prepared By</div><div class="v">${esc(q.prepared_by)}</div></div><div class="qsep"></div>
      <div class="qk"><div class="l">Tooling (est.)</div><div class="v">$${q.total_tooling.toLocaleString()}</div></div><div class="qsep"></div>
      <div class="qk"><div class="l">Est. Annual Rev.</div><div class="v big">$${Math.round(totalVal).toLocaleString()}</div></div><div class="qsep"></div>
      <div class="qk"><div class="l">Risk</div><div class="v big" style="color:${riskColor(q.risk_score)}">${q.risk_score}/100</div></div>
    </div>
    <div class="sec-lab">Quote Line Items${q.lines.length>1?' — '+q.lines.length+' sub-parts':''}</div>
    <div class="card" style="overflow-x:auto">
      <table class="tbl r"><thead><tr><th>Part No.</th><th>Description</th><th>Volume</th><th>Unit Price</th><th>Tooling</th><th>Pkg/pc</th><th>Qual/pc</th><th>Margin</th></tr></thead><tbody>${lineRows}</tbody></table>
    </div>
    <div class="cols2" style="margin-top:16px">
      <div class="card"><div class="card-h">Cost Breakdown — USD/pc${q.lines.length>1?' (assembly)':''}</div><div style="padding:14px 18px">
        ${Object.entries(cbLabels).map(([k,lab])=>{const v=cb[k];const warn=(k==='packaging'&&v===0)||(k==='logistics'&&v===0&&c.incoterm.startsWith('DDP'));return `<div class="cb-row"><span class="l">${lab}</span><span class="track"><i style="width:${Math.min(100,v/maxV*100)}%;background:${warn?'var(--bad)':'var(--accent)'}"></i></span><span class="v" style="color:${warn?'var(--bad)':'var(--ink)'}">${warn?'⚠':''}$${v.toFixed(2)}</span></div>`;}).join('')}
        <div class="cb-row" style="font-weight:700"><span class="l">Total Cost</span><span class="track"></span><span class="v">$${cb.total.toFixed(2)}</span></div>
      </div></div>
      <div class="card"><div class="card-h">Historical Benchmark — ${q.hist_match.length} matched</div><div style="padding:14px 18px">
        ${hist.map(h=>`<div class="bm-row"><span class="pj">${h.id}</span><span class="meta">${esc(h.pn)} · ${esc(h.material)} · ${h.vol.toLocaleString()} pcs · L${h.ppap}</span><span class="pr">$${h.price.toFixed(2)}</span><span class="bm-out ${h.award==='Won'?'won':'lost'}">${h.award}</span></div>`).join('')}
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px">
          <div><div class="l" style="font-size:10px;text-transform:uppercase;color:var(--ink3);margin-bottom:4px">Hist. Price Band</div><div class="num" style="font-size:16px;font-weight:700;color:var(--ok)">$${q.hist_price_band[0].toFixed(2)} – $${q.hist_price_band[1].toFixed(2)}</div></div>
          <div><div class="l" style="font-size:10px;text-transform:uppercase;color:var(--ink3);margin-bottom:4px">Hist. Tooling Band</div><div class="num" style="font-size:16px;font-weight:700;color:var(--ok)">$${(q.hist_tooling_band[0]/1000).toFixed(0)}K – $${(q.hist_tooling_band[1]/1000).toFixed(0)}K</div></div>
        </div>
        ${c.risk_score>=60?`<div style="margin-top:14px;background:var(--bad-soft);border:1px solid #e8c9c4;border-radius:8px;padding:12px 14px;font-size:13px;color:var(--ink2)"><b style="color:var(--bad)">Risk flag</b> — ${c.completeness==='incomplete'?'Quote blocked — missing specs must be resolved first. Benchmark is reference only.':'Multiple cost gaps detected (packaging, logistics, PPAP, gauges). Corrected cost is materially higher than the current draft. Management review required.'}</div>`:''}
      </div></div>
    </div>`;
}

/* commercial notes per case */
const NOTES={
  A:[{sev:'medium',ti:'Annual price reduction',tx:'2% annual reduction after Year 1 must be modeled. At 180K units and $4.08 launch, ~5-year cumulative impact ≈ $160K.'},
     {sev:'low',ti:'Package complete',tx:'All required documents received and parsed. Minor packaging cost gap (RULE_019) is resolvable before release.'}],
  B:[{sev:'high',ti:'Incomplete package — quote blocked',tx:'Packaging spec and DV/PV test standard both missing. Two blocking gaps must be resolved before release.'},
     {sev:'medium',ti:'Appearance approval timeline risk',tx:'Appearance sample approval required prior to PPAP — not in the current program plan; may impact SOP.'}],
  C:[{sev:'high',ti:'High risk — management review required',tx:'Risk 89/100. 14 rules triggered. DDP Monterrey, Net 120, PPAP L5, supplier gauges and 4% APD are all above family norm.'},
     {sev:'high',ti:'DDP Monterrey logistics gap',tx:'Logistics in template is at FOB rate. DDP requires a full rebuild: freight, customs, brokerage, volatility buffer.'},
     {sev:'high',ti:'4% APD over program life',tx:'At $6.18 launch, year-5 effective ≈ $5.05 after 4% compounding. Validate margin floor at year 5, not just launch.'}],
  D:[{sev:'high',ti:'Critical multi-part RFQ — 46 open gaps',tx:'Risk 94/100. Aluminium assembly with 6 sub-parts. Weld spec, leak-test standard and packaging spec all missing; capacity flagged below volume.'},
     {sev:'high',ti:'No historical cost anchor',tx:'AA5754 pan and AA6082 cross member are new materials/processes vs the steel family. Cost must be built bottom-up.'},
     {sev:'high',ti:'DDP Stuttgart + Net 120 on high-value assembly',tx:'Intercontinental DDP on a bulky aluminium tray plus Net 120 on ~$1.7M+ annual revenue — material logistics and financing exposure.'}]
};

renderCasesList();
renderAll();
</script>
