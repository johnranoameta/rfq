<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RFQ Dossier · NorthBridge Automotive</title>
<style>
/* ════════ DOSSIER — editorial report treatment ════════
   Palette:
     --paper:   #faf8f5   warm parchment (not cream — slightly cooler)
     --panel:   #f2ede6   section panel tint
     --rule:    #cdc5b8   hairline rules
     --rule2:   #e6e0d8   lighter rules
     --ink:     #1c1916   near-black, warm cast
     --ink2:    #6a6055   body secondary
     --ink3:    #9c9285   captions / labels
     --ox:      #8a4b4b   oxblood accent (used sparingly)
     --ox-soft: #f5edec   oxblood tint
     --bad:     #a8443a   high severity
     --warn:    #b07b2f   medium severity
     --ok:      #2f7d4f   low / ok
     --bad-s:   #fdf0ef   high tint
     --warn-s:  #fdf6ec   medium tint
     --ok-s:    #edf6f1   ok tint
   ════════════════════════════════════════════════════ */
:root{
  --paper:#faf8f5; --panel:#f2ede6; --rule:#cdc5b8; --rule2:#e6e0d8;
  --ink:#1c1916; --ink2:#6a6055; --ink3:#9c9285;
  --ox:#8a4b4b; --ox-soft:#f5edec;
  --bad:#a8443a; --warn:#b07b2f; --ok:#2f7d4f;
  --bad-s:#fdf0ef; --warn-s:#fdf6ec; --ok-s:#edf6f1;
  --serif:Georgia,"Times New Roman",Times,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6}
.num{font-variant-numeric:tabular-nums}

/* ── Shell ── */
.shell{display:flex;height:100vh;overflow:hidden}

/* ── Sidebar ── */
.sidebar{
  width:216px;min-width:216px;background:var(--paper);
  border-right:1px solid var(--rule);
  display:flex;flex-direction:column;
  padding:0;overflow:hidden;flex-shrink:0;
}
.sidebar-logo{
  padding:20px 20px 16px;border-bottom:1px solid var(--rule);
}
.sidebar-logo .wordmark{
  font-family:var(--serif);font-size:13px;letter-spacing:.02em;
  color:var(--ox);font-weight:normal;text-transform:uppercase;
}
.sidebar-logo .sub{font-size:11px;color:var(--ink3);margin-top:2px}

.case-switcher{padding:14px 12px 10px;border-bottom:1px solid var(--rule2)}
.cs-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px;padding:0 4px}
.cs-btn{
  display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;
  border-radius:4px;cursor:pointer;border:none;background:none;
  font-family:var(--sans);text-align:left;margin-bottom:2px;
  transition:background .1s;
}
.cs-btn:hover{background:var(--panel)}
.cs-btn.active{background:var(--ox-soft)}
.cs-badge{
  width:22px;height:22px;border-radius:3px;
  font-family:var(--serif);font-size:12px;font-weight:bold;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  background:var(--rule2);color:var(--ink2);
}
.cs-btn.active .cs-badge{background:var(--ox);color:#fff}
.cs-info{flex:1;min-width:0}
.cs-name{font-size:12px;font-weight:600;color:var(--ink);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs-meta{font-size:11px;color:var(--ink3);margin-top:1px}
.cs-risk{font-size:11px;font-weight:700;font-family:var(--mono);margin-left:auto;flex-shrink:0}

.toc-nav{flex:1;overflow-y:auto;padding:14px 12px 20px}
.toc-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:10px;padding:0 4px}
.toc-link{
  display:flex;align-items:baseline;gap:8px;width:100%;
  padding:7px 10px;border-radius:4px;border:none;background:none;
  font-family:var(--sans);font-size:12.5px;color:var(--ink2);
  cursor:pointer;text-align:left;transition:background .1s;
}
.toc-link:hover{background:var(--panel);color:var(--ink)}
.toc-link.active{background:var(--ox-soft);color:var(--ox)}
.toc-num{font-family:var(--serif);font-size:12px;color:var(--ink3);width:14px;flex-shrink:0;font-style:italic}
.toc-link.active .toc-num{color:var(--ox)}

/* ── Main reading area ── */
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;min-width:0}
.main-inner{max-width:860px;margin:0 auto;padding:40px 48px 80px;width:100%}

/* ── Document header ── */
.doc-header{border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:32px}
.doc-eyebrow{
  font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:var(--ox);margin-bottom:10px;
}
.doc-title{font-family:var(--serif);font-size:26px;line-height:1.25;color:var(--ink);text-wrap:balance;margin-bottom:8px}
.doc-meta-row{display:flex;gap:24px;flex-wrap:wrap;align-items:baseline;margin-top:10px}
.doc-meta-item{font-size:12px;color:var(--ink3)}
.doc-meta-item strong{color:var(--ink2);font-weight:600}

/* ── Section ── */
.section{margin-bottom:48px}
.section-heading{
  display:flex;align-items:baseline;gap:12px;
  margin-bottom:20px;padding-bottom:8px;
  border-bottom:1px solid var(--rule);
}
.section-num{
  font-family:var(--serif);font-style:italic;font-size:18px;
  color:var(--ink3);min-width:22px;
}
.section-title{
  font-family:var(--serif);font-size:19px;font-weight:normal;
  color:var(--ink);letter-spacing:.01em;
}

/* ── KPI strip ── */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);margin-bottom:20px}
.kpi{background:var(--paper);padding:16px 18px}
.kpi-l{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.kpi-v{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--ink);line-height:1}
.kpi-sub{font-size:11px;color:var(--ink3);margin-top:5px}
.kpi-bar{height:3px;background:var(--rule2);margin-top:10px;overflow:hidden}
.kpi-bar-fill{height:100%;background:var(--ox)}

/* ── Status badge ── */
.status-badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 12px;border-radius:2px;
  font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
}
.status-badge.ok{background:var(--ok-s);color:var(--ok)}
.status-badge.warn{background:var(--warn-s);color:var(--warn)}
.status-badge.bad{background:var(--bad-s);color:var(--bad)}

/* ── Workflow steps ── */
.wf-row{display:flex;align-items:center;gap:0;margin-bottom:20px;flex-wrap:wrap;gap:4px}
.wf-step{display:flex;align-items:center;gap:7px}
.wf-dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--rule);background:var(--paper);flex-shrink:0}
.wf-dot.done{background:var(--ok);border-color:var(--ok)}
.wf-dot.active{background:var(--ox);border-color:var(--ox)}
.wf-dot.pending{background:var(--paper);border-color:var(--rule)}
.wf-name{font-size:12px;color:var(--ink3);white-space:nowrap}
.wf-name.done{color:var(--ink2)}
.wf-name.active{color:var(--ox);font-weight:600}
.wf-arrow{color:var(--rule);font-size:11px;margin:0 4px;user-select:none}

/* ── Info grid ── */
.info-table{width:100%;border-collapse:collapse;margin-bottom:20px;border:1px solid var(--rule)}
.info-table td{padding:9px 14px;font-size:13px;border-bottom:1px solid var(--rule2);vertical-align:top}
.info-table td:first-child{width:200px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);background:var(--panel)}
.info-table tr:last-child td{border-bottom:none}
.info-table td.flag-bad{color:var(--bad);font-weight:600}
.info-table td.flag-warn{color:var(--warn);font-weight:600}

/* ── Risk note ── */
.risk-note{
  border-left:3px solid var(--ox);background:var(--ox-soft);
  padding:14px 18px;margin-bottom:12px;font-size:13px;line-height:1.6;
}
.risk-note strong{color:var(--ox)}

/* ── Tables ── */
.ruled-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:4px}
.ruled-table th{
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--ink3);text-align:left;padding:8px 12px;
  border-bottom:2px solid var(--rule);background:var(--panel);
}
.ruled-table td{padding:9px 12px;border-bottom:1px solid var(--rule2);vertical-align:middle;color:var(--ink)}
.ruled-table tr:last-child td{border-bottom:none}
.ruled-table tr:hover td{background:var(--panel)}
.ruled-table .num{font-family:var(--mono)}
.ruled-table td.right,.ruled-table th.right{text-align:right}
.ruled-table td.mono{font-family:var(--mono);font-size:12px}

/* doc status */
.doc-ok{color:var(--ok);font-weight:600}
.doc-miss{color:var(--bad);font-weight:600}
.conf-bar{display:inline-block;width:48px;height:4px;background:var(--rule2);border-radius:2px;vertical-align:middle;overflow:hidden;margin-left:6px}
.conf-fill{height:100%;background:var(--ok);border-radius:2px}

/* ── Process pills ── */
.proc-list{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.proc-pill{
  font-size:12px;padding:4px 12px;border:1px solid var(--rule);
  background:var(--paper);color:var(--ink2);border-radius:2px;
}

/* ── Sub-part table ── */
.subpart-row td{background:var(--panel)}

/* ── Gap section ── */
.gap-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.gap-search{
  flex:1;min-width:180px;position:relative;
}
.gap-search input{
  width:100%;padding:8px 10px 8px 32px;
  border:1px solid var(--rule);background:var(--paper);
  font-family:var(--sans);font-size:13px;color:var(--ink);
  border-radius:2px;outline:none;
}
.gap-search input:focus{border-color:var(--ox)}
.gap-search-icon{position:absolute;left:9px;top:9px;width:14px;height:14px;color:var(--ink3);pointer-events:none}
.sev-filter{display:flex;gap:4px;flex-wrap:wrap}
.sev-btn{
  font-size:11px;font-weight:700;padding:6px 12px;border-radius:2px;
  border:1px solid var(--rule);background:var(--paper);color:var(--ink3);
  cursor:pointer;letter-spacing:.04em;text-transform:uppercase;transition:all .1s;
}
.sev-btn:hover{border-color:var(--ink3);color:var(--ink)}
.sev-btn.on.all{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.sev-btn.on.high{border-color:var(--bad);background:var(--bad-s);color:var(--bad)}
.sev-btn.on.medium{border-color:var(--warn);background:var(--warn-s);color:var(--warn)}
.sev-btn.on.low{border-color:var(--ok);background:var(--ok-s);color:var(--ok)}

/* Gap summary table (Case D) */
.gap-summary-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:24px;border:1px solid var(--rule)}
.gap-summary-table th{
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  color:var(--ink3);padding:7px 11px;border-bottom:2px solid var(--rule);
  background:var(--panel);text-align:left;
}
.gap-summary-table td{padding:7px 11px;border-bottom:1px solid var(--rule2)}
.gap-summary-table tr:last-child td{border-bottom:none}
.gap-summary-table .num{font-family:var(--mono);text-align:center}

/* Sub-part group heading */
.part-group-heading{
  margin:28px 0 12px;padding:8px 0;
  border-bottom:1px solid var(--rule);
  display:flex;align-items:baseline;gap:10px;
}
.part-group-title{font-family:var(--serif);font-size:15px;color:var(--ink)}
.part-group-count{font-size:11px;color:var(--ink3)}
.part-group-heading:first-of-type{margin-top:0}

/* Collapsible finding */
.finding{border:1px solid var(--rule2);margin-bottom:6px;border-radius:2px;overflow:hidden}
.finding.hidden-finding{display:none}
.finding-header{
  display:flex;align-items:baseline;gap:10px;
  padding:11px 14px;cursor:pointer;user-select:none;
  background:var(--paper);transition:background .1s;
}
.finding-header:hover{background:var(--panel)}
.finding.open .finding-header{background:var(--panel);border-bottom:1px solid var(--rule2)}
.finding-num{font-family:var(--serif);font-style:italic;font-size:12px;color:var(--ink3);flex-shrink:0;min-width:28px}
.finding-title{font-size:13.5px;font-weight:600;color:var(--ink);flex:1;line-height:1.4}
.sev-tag{
  font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 8px;border-radius:2px;flex-shrink:0;
}
.sev-tag.high{background:var(--bad-s);color:var(--bad);border:1px solid #f0c4c2}
.sev-tag.medium{background:var(--warn-s);color:var(--warn);border:1px solid #f0dfb8}
.sev-tag.low{background:var(--ok-s);color:var(--ok);border:1px solid #b8dfc8}
.cat-tag{font-size:11px;color:var(--ink3);text-transform:capitalize;flex-shrink:0}
.finding-chev{color:var(--ink3);flex-shrink:0;transition:transform .15s;font-size:10px}
.finding.open .finding-chev{transform:rotate(180deg)}

.finding-body{display:none;padding:14px 16px 16px 42px}
.finding.open .finding-body{display:block}
.finding-detail{font-size:13px;color:var(--ink2);line-height:1.7;margin-bottom:14px}
.finding-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px;padding:12px 14px;background:var(--panel);border:1px solid var(--rule2)}
.finding-meta-item .fl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);margin-bottom:3px}
.finding-meta-item .fv{font-size:12.5px;color:var(--ink);font-weight:600}
.action-note{
  border-left:2px solid var(--ox);padding:10px 14px;
  background:var(--ox-soft);font-size:13px;color:var(--ink2);line-height:1.6;
}
.action-note .al{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ox);margin-bottom:5px}
.hist-compare{margin-top:12px;border:1px solid var(--rule2);border-radius:2px;overflow:hidden}
.hist-compare-h{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);background:var(--panel);padding:7px 12px;border-bottom:1px solid var(--rule2)}
.hist-compare-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule2)}
.hist-compare-cell{background:var(--paper);padding:9px 12px}
.hist-compare-cell .cl{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);margin-bottom:3px}
.hist-compare-cell .cv{font-size:12.5px;font-weight:700;font-family:var(--mono)}

/* ── Quote ── */
.quote-header-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);margin-bottom:20px}
.qhk{background:var(--paper);padding:12px 15px}
.qhk .ql{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);margin-bottom:4px}
.qhk .qv{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--ink)}
.qhk .qv.bad{color:var(--bad)}
.qhk .qv.warn{color:var(--warn)}
.qhk .qv.ok{color:var(--ok)}

/* Cost breakdown */
.cost-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:20px}
.cost-bar-list{border:1px solid var(--rule2)}
.cost-bar-row{display:flex;align-items:center;gap:12px;padding:9px 13px;border-bottom:1px solid var(--rule2)}
.cost-bar-row:last-child{border-bottom:none;border-top:2px solid var(--rule);font-weight:700;background:var(--panel)}
.cbl-name{font-size:12.5px;color:var(--ink2);flex:1}
.cbl-bar{flex:2;height:4px;background:var(--rule2);border-radius:2px;overflow:hidden}
.cbl-bar-fill{height:100%;background:var(--ox);opacity:.6;border-radius:2px}
.cbl-val{font-family:var(--mono);font-size:12.5px;color:var(--ink);width:48px;text-align:right}

/* Hist benchmark */
.bench-table{border:1px solid var(--rule2);margin-top:4px}
.bench-band{
  padding:14px 16px;background:var(--panel);border-bottom:1px solid var(--rule2);
  display:flex;gap:24px;align-items:center;flex-wrap:wrap;
}
.band-item .bl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);margin-bottom:4px}
.band-item .bv{font-family:var(--mono);font-size:15px;font-weight:700}
.band-arrow{color:var(--ink3);font-size:18px;margin-top:14px}

/* risk score visual */
.risk-meter{display:flex;align-items:center;gap:10px;margin-top:8px}
.risk-track{flex:1;height:6px;background:var(--rule2);border-radius:3px;overflow:hidden;position:relative}
.risk-fill{height:100%;border-radius:3px}
.risk-label{font-family:var(--mono);font-size:13px;font-weight:700;min-width:28px}

/* no-results */
.no-results{padding:32px;text-align:center;color:var(--ink3);font-size:13px;font-style:italic}

/* scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--ink3)}

/* focus */
*:focus-visible{outline:2px solid var(--ox);outline-offset:2px}

@media(prefers-reduced-motion:reduce){
  *{transition:none!important}
}
</style>
</head>
<body>

<div class="shell">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="wordmark">RFQ Dossier</div>
      <div class="sub">NorthBridge Automotive</div>
    </div>

    <div class="case-switcher">
      <div class="cs-label">Active Case</div>
      <div id="case-buttons"></div>
    </div>

    <nav class="toc-nav">
      <div class="toc-label">Contents</div>
      <div id="toc-links"></div>
    </nav>
  </aside>

  <!-- Main -->
  <main class="main" id="main-scroll">
    <div class="main-inner" id="main-inner">
      <!-- rendered by JS -->
    </div>
  </main>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   RFQ ASSISTANT — CANONICAL MOCKUP DATA  (shared across all 5 designs)
   Inline this whole block into each mockup so every file is self-contained.
   Cases A/B/C carried from the v2.1 mock; Case D added as a 45+ gap stress test.
═══════════════════════════════════════════════════════════════════════ */

const RULE_CATALOG = {
  RULE_001:{name:"Missing packaging specification",cat:"completeness",sev:"high"},
  RULE_002:{name:"Missing test standard",cat:"completeness",sev:"high"},
  RULE_003:{name:"PPAP level above historical baseline",cat:"quality",sev:"high"},
  RULE_004:{name:"General tolerance tighter than historical family",cat:"technical",sev:"high"},
  RULE_005:{name:"Critical tolerance at or below 0.03 mm",cat:"technical",sev:"high"},
  RULE_007:{name:"Supplier-funded gauges required",cat:"quality",sev:"high"},
  RULE_008:{name:"100% appearance inspection required",cat:"quality",sev:"high"},
  RULE_009:{name:"Payment terms extended beyond historical norm",cat:"commercial",sev:"medium"},
  RULE_010:{name:"Annual price reduction above historical norm",cat:"commercial",sev:"medium"},
  RULE_011:{name:"DDP or supplier-managed freight required",cat:"commercial",sev:"high"},
  RULE_012:{name:"Returnable packaging required",cat:"logistics",sev:"medium"},
  RULE_013:{name:"Premium freight recovery excluded",cat:"commercial",sev:"medium"},
  RULE_015:{name:"Special surface or burr requirement below family norm",cat:"technical",sev:"medium"},
  RULE_016:{name:"Cpk target above family baseline",cat:"quality",sev:"medium"},
  RULE_017:{name:"Run-at-rate required beyond normal PPAP",cat:"quality",sev:"medium"},
  RULE_018:{name:"Annual revalidation / corrosion retention required",cat:"quality",sev:"low"},
  RULE_019:{name:"No explicit packaging cost line in quote template",cat:"quote",sev:"high"},
  RULE_021:{name:"Material grade not in historical database",cat:"technical",sev:"high"},
  RULE_022:{name:"Weld / joining spec referenced but not supplied",cat:"completeness",sev:"high"},
  RULE_023:{name:"Capacity below requested annual volume",cat:"commercial",sev:"high"},
  RULE_024:{name:"Tooling ownership unspecified",cat:"commercial",sev:"medium"},
  RULE_025:{name:"Secondary coating / e-coat requirement",cat:"technical",sev:"medium"},
  RULE_027:{name:"Appearance approval required prior to PPAP",cat:"quality",sev:"medium"},
  RULE_028:{name:"Customer specification reference unresolved",cat:"completeness",sev:"medium"},
  RULE_029:{name:"Traceability / lot marking required",cat:"quality",sev:"low"},
  RULE_030:{name:"Sub-part interface tolerance stack-up unverified",cat:"technical",sev:"medium"},
};

const HISTORICAL = [

const DOC_TYPE_LABEL = {rfq:"RFQ Main",cost:"Cost Template",draw:"Drawing",pkg:"Packaging",test:"Test Spec",q:"Questionnaire"};
const CASE_ORDER = ["A","B","C","D"];

/* ════════════════════════════════════════════════════════════════
   RENDER ENGINE
════════════════════════════════════════════════════════════════ */

let currentCase = "A";
let currentSection = "overview";
let gapSevFilter = "all";
let gapSearchTerm = "";

const SECTIONS = [
  {id:"overview",  num:"1", label:"Overview"},
  {id:"documents", num:"2", label:"Documents"},
  {id:"part",      num:"3", label:"Part Detail"},
  {id:"gaps",      num:"4", label:"Gap Analysis"},
  {id:"quote",     num:"5", label:"Quote & Benchmark"},
];

function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmt$(n){ return n==null?"—":"$"+Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtK(n){ return n==null?"—":"$"+(n>=1000?(n/1000).toFixed(0)+"K":n); }
function fmtPct(n){ return n==null?"—":n+"%"; }
function fmtVol(n){ return n==null?"—":Number(n).toLocaleString("en-US"); }

function riskClass(score){
  if(score>=80) return "bad";
  if(score>=50) return "warn";
  return "ok";
}
function riskColor(score){
  if(score>=80) return "var(--bad)";
  if(score>=50) return "var(--warn)";
  return "var(--ok)";
}
function statusClass(c){
  const s=(c.status_label||"").toLowerCase();
  if(s.includes("critical")||s.includes("high risk")) return "bad";
  if(s.includes("incomplete")) return "warn";
  return "ok";
}

function buildCaseSwitcher(){
  const el = document.getElementById("case-buttons");
  el.innerHTML = CASE_ORDER.map(k=>{
    const c = CASES[k];
    const rc = riskClass(c.risk_score);
    const col = rc==="bad"?"var(--bad)":rc==="warn"?"var(--warn)":"var(--ok)";
    return `<button class="cs-btn${k===currentCase?" active":""}" onclick="switchCase('${k}')" aria-pressed="${k===currentCase}">
      <div class="cs-badge">${esc(k)}</div>
      <div class="cs-info">
        <div class="cs-name">${esc(c.title)}</div>
        <div class="cs-meta">${esc(c.rfq_num)}</div>
      </div>
      <div class="cs-risk" style="color:${col}">${c.risk_score}</div>
    </button>`;
  }).join("");
}

function buildTOC(){
  const el = document.getElementById("toc-links");
  el.innerHTML = SECTIONS.map(s=>`
    <button class="toc-link${s.id===currentSection?" active":""}" onclick="switchSection('${s.id}')" aria-current="${s.id===currentSection}">
      <span class="toc-num">${esc(s.num)}.</span>
      ${esc(s.label)}
    </button>
  `).join("");
}

function switchCase(k){
  currentCase = k;
  gapSevFilter = "all";
  gapSearchTerm = "";
  buildCaseSwitcher();
  renderMain();
  buildTOC();
}

function switchSection(id){
  currentSection = id;
  buildTOC();
  const el = document.getElementById("sec-"+id);
  if(el){ el.scrollIntoView({behavior:"smooth",block:"start"}); }
}

/* ── Scroll spy ── */
function setupScrollSpy(){
  const main = document.getElementById("main-scroll");
  if(!main || typeof main.addEventListener !== "function") return;
  main.addEventListener("scroll", ()=>{
    const sections = SECTIONS.map(s=>({id:s.id, el:document.getElementById("sec-"+s.id)})).filter(x=>x.el&&typeof x.el.offsetTop==="number");
    if(!sections.length) return;
    const scrollTop = main.scrollTop + 80;
    let active = sections[0].id;
    for(const s of sections){
      if(s.el.offsetTop <= scrollTop) active = s.id;
    }
    if(active !== currentSection){
      currentSection = active;
      buildTOC();
    }
  },{passive:true});
}

function renderOverview(c){
  const findings = c.gap_findings||[];
  const highCount = findings.filter(f=>f.sev==="high").length;
  const medCount = findings.filter(f=>f.sev==="medium").length;
  const lowCount = findings.filter(f=>f.sev==="low").length;
  const totalDocs = (c.docs||[]).length;
  const missDocs = (c.docs||[]).filter(d=>d.status==="miss").length;

  // Workflow steps
  const wfSteps = [
    {label:"RFQ Received",done:true},
    {label:"Extraction",done:true},
    {label:"Gap Analysis",done:true},
    {label:"Quote Draft",done:c.quote&&c.quote.version&&!c.quote.version.includes("Blocked")},
    {label:"Risk Review",done:false,active:true},
    {label:"Release",done:false},
  ];
  const wfHtml = wfSteps.map((s,i)=>`
    <span class="wf-step">
      <span class="wf-dot ${s.done?"done":s.active?"active":"pending"}"></span>
      <span class="wf-name ${s.done?"done":s.active?"active":""}"> ${esc(s.label)}</span>
    </span>${i<wfSteps.length-1?'<span class="wf-arrow">›</span>':''}
  `).join("");

  // Status badge
  const sc = statusClass(c);
  const completenessVal = c.completeness==="complete"?100:c.completeness==="incomplete"?68:85;

  // Risk notes
  let riskNotes = "";
  if(c.risk_score>=80){
    riskNotes = `<div class="risk-note"><strong>High-risk assessment.</strong> This RFQ carries a risk score of ${c.risk_score}/100. Multiple high-severity findings must be resolved before this quote can be released. Review Gap Analysis (Section 4) for required actions.</div>`;
  } else if(c.risk_score>=50){
    riskNotes = `<div class="risk-note"><strong>Elevated risk — blocked.</strong> Risk score: ${c.risk_score}/100. Missing documents prevent final pricing. Resolve open items before submission.</div>`;
  }

  return `
    <div class="wf-row">${wfHtml}</div>

    <div class="kpi-row">
      <div class="kpi">
        <div class="kpi-l">Completeness</div>
        <div class="kpi-v num">${completenessVal}%</div>
        <div class="kpi-sub">${missDocs>0?missDocs+" doc"+(missDocs>1?"s":"")+" missing":"All documents received"}</div>
        <div class="kpi-bar"><div class="kpi-bar-fill" style="width:${completenessVal}%"></div></div>
      </div>
      <div class="kpi">
        <div class="kpi-l">Open Findings</div>
        <div class="kpi-v num">${findings.length}</div>
        <div class="kpi-sub">${highCount} high · ${medCount} medium · ${lowCount} low</div>
      </div>
      <div class="kpi">
        <div class="kpi-l">Risk Score</div>
        <div class="kpi-v num" style="color:${riskColor(c.risk_score)}">${c.risk_score}</div>
        <div class="risk-meter">
          <div class="risk-track"><div class="risk-fill" style="width:${c.risk_score}%;background:${riskColor(c.risk_score)}"></div></div>
          <span class="risk-label num" style="color:${riskColor(c.risk_score)}">${c.risk_score}</span>
        </div>
      </div>
      <div class="kpi">
        <div class="kpi-l">Status</div>
        <div class="kpi-v" style="font-size:15px;margin-top:6px"><span class="status-badge ${sc}">${esc(c.status_label)}</span></div>
        <div class="kpi-sub">${(c.triggered_rules||[]).length} rules triggered</div>
      </div>
    </div>

    ${riskNotes}

    <table class="info-table">
      <tr><td>Customer</td><td>${esc(c.customer)}</td></tr>
      <tr><td>Program</td><td>${esc(c.program)}</td></tr>
      <tr><td>Part Number</td><td><code style="font-family:var(--mono);font-size:12.5px">${esc(c.part_number)}</code></td></tr>
      <tr><td>RFQ Number</td><td><code style="font-family:var(--mono);font-size:12.5px">${esc(c.rfq_num)}</code></td></tr>
      <tr><td>SOP Date</td><td>${esc(c.sop)}</td></tr>
      <tr><td>Annual Volume</td><td class="num">${fmtVol(c.annual_vol)} units/yr</td></tr>
      <tr><td>Incoterm</td><td class="${(c.incoterm||"").includes("DDP")?"flag-bad":""}">${esc(c.incoterm)}</td></tr>
      <tr><td>Payment Terms</td><td class="${(c.payment||"").includes("120")?"flag-bad":(c.payment||"").includes("75")?"flag-warn":""}">${esc(c.payment)}</td></tr>
      <tr><td>Annual Price-Down</td><td class="${(c.apd||0)>=3?"flag-bad":(c.apd||0)>=2.5?"flag-warn":""}">${c.apd}%/yr</td></tr>
      <tr><td>PPAP Level</td><td class="${c.ppap>=5?"flag-bad":""}">${c.ppap}</td></tr>
      <tr><td>Tooling Owner</td><td>${esc(c.tooling_owner)}</td></tr>
      <tr><td>Triggered Rules</td><td>${(c.triggered_rules||[]).map(r=>`<code style="font-family:var(--mono);font-size:11px;background:var(--panel);padding:1px 6px;border-radius:2px;margin-right:4px">${esc(r)}</code>`).join("")}</td></tr>
    </table>
  `;
}

      <tr><td>Critical Tolerance</td><td class="flag-bad">${esc(c.critical_tol)}</td></tr>
      <tr><td>Cpk Requirement</td><td>${esc(c.cpk)}</td></tr>
      <tr><td>Surface Requirements</td><td>${(c.surface||[]).map(s=>`<span style="display:inline-block;font-size:12px;background:var(--panel);border:1px solid var(--rule2);padding:2px 8px;border-radius:2px;margin:2px 4px 2px 0">${esc(s)}</span>`).join("")}</td></tr>
    </table>

    <p style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px">Process Route</p>
    <div class="proc-list">
      ${(c.process||[]).map((p,i)=>`<span class="proc-pill">${i>0?'<span style="color:var(--ink3);margin-right:8px">→</span>':''} ${esc(p)}</span>`).join("")}
    </div>

    <table class="info-table" style="margin-top:16px">
      <tr><td>Supplier-Funded Gauges</td><td class="${c.supplier_funded_gauges?"flag-bad":""}">${c.supplier_funded_gauges?"Yes — required":"No"}</td></tr>
      <tr><td>Assembly Type</td><td>${isMulti?"Multi-part assembly":"Single part"}</td></tr>
    </table>

    ${subPartHtml}
  `;
}

function renderGaps(c){
  const findings = c.gap_findings||[];
  const isMulti = !!c.multi_part;

  // Summary counts
  const highCt = findings.filter(f=>f.sev==="high").length;
  const medCt = findings.filter(f=>f.sev==="medium").length;
  const lowCt = findings.filter(f=>f.sev==="low").length;

  // Filter + search
  function matches(f){
    if(gapSevFilter!=="all" && f.sev!==gapSevFilter) return false;
    if(gapSearchTerm){
      const q=gapSearchTerm.toLowerCase();
      return (f.title||"").toLowerCase().includes(q)||(f.detail||"").toLowerCase().includes(q)||(f.rule||"").toLowerCase().includes(q)||(f.cat||"").toLowerCase().includes(q)||(f.part||"").toLowerCase().includes(q);
    }
    return true;
  }

  const filtered = findings.filter(matches);

  // For Case D: group by part
  let bodyHtml = "";

  if(isMulti){
    // Summary table
    const parts = [...new Set(findings.map(f=>f.part))];
    const summaryRows = parts.map(pt=>{
      const pf = findings.filter(f=>f.part===pt);
      return `<tr>
        <td>${esc(pt)}</td>
        <td class="num" style="text-align:center;color:var(--bad)">${pf.filter(f=>f.sev==="high").length}</td>
        <td class="num" style="text-align:center;color:var(--warn)">${pf.filter(f=>f.sev==="medium").length}</td>
        <td class="num" style="text-align:center;color:var(--ok)">${pf.filter(f=>f.sev==="low").length}</td>
        <td class="num" style="text-align:center;font-weight:700">${pf.length}</td>
      </tr>`;
    }).join("");

    bodyHtml = `
      <div style="overflow-x:auto">
      <table class="gap-summary-table">
        <thead>
          <tr>
            <th>Sub-Part</th>
            <th style="text-align:center">High</th>
            <th style="text-align:center">Medium</th>
            <th style="text-align:center">Low</th>
            <th style="text-align:center">Total</th>
          </tr>
        </thead>
        <tbody>${summaryRows}</tbody>
      </table>
      </div>
    `;

    // Group filtered findings by part
    const groupedParts = parts;
    let globalN = 0;
    bodyHtml += groupedParts.map(pt=>{
      const partFindings = filtered.filter(f=>f.part===pt);
      if(partFindings.length===0) return "";
      const allPartFindings = findings.filter(f=>f.part===pt);
      const partHigh = allPartFindings.filter(f=>f.sev==="high").length;
      const partMed = allPartFindings.filter(f=>f.sev==="medium").length;
      const partLow = allPartFindings.filter(f=>f.sev==="low").length;
      let rows = "";
      partFindings.forEach(f=>{
        globalN++;
        rows += renderFinding(f, globalN);
      });
      return `
        <div class="part-group-heading">
          <span class="part-group-title">${esc(pt)}</span>
          <span class="part-group-count">${partHigh>0?`<span style="color:var(--bad)">${partHigh}H</span> `:""}${partMed>0?`<span style="color:var(--warn)">${partMed}M</span> `:""}${partLow>0?`<span style="color:var(--ok)">${partLow}L</span>`:""}</span>
        </div>
        ${rows}
      `;
    }).join("");
  } else {
    let n=0;
    bodyHtml = filtered.map(f=>{ n++; return renderFinding(f,n); }).join("");
  }

  if(filtered.length===0){
    bodyHtml += `<div class="no-results">No findings match the current filter.</div>`;
  }

  return `
    <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px">
      <div style="font-size:13px;color:var(--ink2)">${findings.length} total findings — <span style="color:var(--bad);font-weight:700">${highCt} high</span> · <span style="color:var(--warn);font-weight:700">${medCt} medium</span> · <span style="color:var(--ok);font-weight:700">${lowCt} low</span></div>
    </div>

    <div class="gap-toolbar">
      <div class="gap-search">
        <svg class="gap-search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="6.5" cy="6.5" r="4.5"/><path d="M10.5 10.5l3 3"/>
        </svg>
        <input type="text" placeholder="Search findings…" value="${esc(gapSearchTerm)}" oninput="onGapSearch(event)" aria-label="Search gap findings">
      </div>
      <div class="sev-filter">
        <button class="sev-btn on all${gapSevFilter==="all"?"":" off"}" onclick="setGapFilter('all')">All</button>
        <button class="sev-btn${gapSevFilter==="high"?" on high":""}" onclick="setGapFilter('high')">High</button>
        <button class="sev-btn${gapSevFilter==="medium"?" on medium":""}" onclick="setGapFilter('medium')">Medium</button>
        <button class="sev-btn${gapSevFilter==="low"?" on low":""}" onclick="setGapFilter('low')">Low</button>
      </div>
    </div>

    <div id="gap-body">${bodyHtml}</div>
  `;
}

function renderFinding(f, n){
  const sevLabel = f.sev==="high"?"High":f.sev==="medium"?"Medium":"Low";
  const histHtml = f.hist?`
    <div class="hist-compare">
      <div class="hist-compare-h">Historical Comparison — ${esc(f.hist.label)}</div>
      <div class="hist-compare-row">
        <div class="hist-compare-cell">
          <div class="cl">Historical</div>
          <div class="cv">${esc(f.hist.hist_val)}</div>
        </div>
        <div class="hist-compare-cell">
          <div class="cl">This RFQ</div>
          <div class="cv" style="color:var(--bad)">${esc(f.hist.curr_val)}</div>
        </div>
        <div class="hist-compare-cell">
          <div class="cl">Projects</div>
          <div class="cv" style="font-size:11.5px">${(f.hist.projects||[]).join(", ")}</div>
        </div>
      </div>
    </div>
  `:"";

  return `
    <div class="finding" id="finding-${n}">
      <div class="finding-header" onclick="toggleFinding(${n})" role="button" aria-expanded="false">
        <span class="finding-num">${n}.</span>
        <span class="finding-title">${esc(f.title)}</span>
        <span class="sev-tag ${f.sev}">${sevLabel}</span>
        <span class="cat-tag">${esc(f.cat)}</span>
        <span class="cat-tag" style="font-family:var(--mono);font-size:10.5px">${esc(f.rule)}</span>
        <svg class="finding-chev" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" width="12" height="12">
          <path d="M2 4l4 4 4-4"/>
        </svg>
      </div>
      <div class="finding-body">
        <p class="finding-detail">${esc(f.detail)}</p>
        <div class="finding-meta">
          <div class="finding-meta-item">
            <div class="fl">Impact</div>
            <div class="fv" style="color:var(--bad)">${esc(f.impact)}</div>
          </div>
          <div class="finding-meta-item">
            <div class="fl">Evidence</div>
            <div class="fv">${esc(f.evidence)}</div>
          </div>
        </div>
        <div class="action-note">
          <div class="al">Recommended Action</div>
          ${esc(f.action)}
        </div>
        ${histHtml}
      </div>
    </div>
  `;
}

function renderQuote(c){
  const q = c.quote;
  if(!q) return `<p style="color:var(--ink3);font-style:italic">No quote data available.</p>`;

  const lines = q.lines||[];
  const cb = q.cost_breakdown||{};
  const totalCost = Object.values(cb).reduce((s,v)=>typeof v==="number"?s+v:s,0)-(cb.total||0);

  // Quote header KPIs
  const totalPiece = lines.reduce((s,l)=>s+(l.price||0),0);
  const avgMargin = lines.length>0?(lines.reduce((s,l)=>s+(l.margin||0),0)/lines.length).toFixed(1):null;
  const rc = riskClass(q.risk_score);

  // Hist match details
  const histItems = (q.hist_match||[]).map(id=>HISTORICAL.find(h=>h.id===id)).filter(Boolean);

  // Line items table
  const linesHtml = `
    <div style="overflow-x:auto">
    <table class="ruled-table">
      <thead>
        <tr>
          <th>Part No.</th>
          <th>Description</th>
          <th>Plant</th>
          <th class="right">Volume</th>
          <th class="right">Unit Price</th>
          <th class="right">Tooling</th>
          <th class="right">Pkg/pc</th>
          <th class="right">Margin%</th>
        </tr>
      </thead>
      <tbody>
        ${lines.map(l=>`
          <tr>
            <td class="mono">${esc(l.pn)}</td>
            <td>${esc(l.name)}</td>
            <td class="mono">${esc(l.plant)}</td>
            <td class="right num">${fmtVol(l.vol)}</td>
            <td class="right num">${fmt$(l.price)}</td>
            <td class="right num">${fmtK(l.tooling)}</td>
            <td class="right num${l.pkg===0?' flag-bad':''}" style="${l.pkg===0?'color:var(--bad)':''}">${fmt$(l.pkg)}</td>
            <td class="right num">${l.margin!=null?l.margin+"%":"—"}</td>
          </tr>
        `).join("")}
      </tbody>
      ${lines.length>1?`<tfoot><tr>
        <td colspan="3" style="font-size:12px;color:var(--ink3);padding:9px 12px">Assembly total</td>
        <td class="right num" style="font-weight:700;padding:9px 12px;border-top:2px solid var(--rule)">${fmtVol(lines[0].vol)}</td>
        <td class="right num" style="font-weight:700;padding:9px 12px;border-top:2px solid var(--rule)">${fmt$(lines.reduce((s,l)=>s+(l.price||0),0))}</td>
        <td class="right num" style="font-weight:700;padding:9px 12px;border-top:2px solid var(--rule)">${fmtK(q.total_tooling)}</td>
        <td colspan="2" style="padding:9px 12px;border-top:2px solid var(--rule)"></td>
      </tr></tfoot>`:""}
    </table>
    </div>
  `;

  // Cost breakdown
  const cbEntries = Object.entries(cb).filter(([k])=>k!=="total");
  const maxCb = Math.max(...cbEntries.map(([,v])=>v));
  const cbHtml = `
    <div class="cost-bar-list">
      ${cbEntries.map(([k,v])=>`
        <div class="cost-bar-row">
          <span class="cbl-name" style="text-transform:capitalize">${k}</span>
          <span class="cbl-bar"><span class="cbl-bar-fill" style="width:${maxCb>0?Math.round((v/maxCb)*100):0}%"></span></span>
          <span class="cbl-val num">${fmt$(v)}</span>
        </div>
      `).join("")}
      ${cb.total!=null?`<div class="cost-bar-row"><span class="cbl-name">Total</span><span class="cbl-bar"></span><span class="cbl-val num" style="font-weight:700">${fmt$(cb.total)}</span></div>`:""}
    </div>
  `;

  // Historical benchmark
  const bandLow = q.hist_price_band&&q.hist_price_band[0];
  const bandHigh = q.hist_price_band&&q.hist_price_band[1];
  const quotePrice = lines[0]&&lines[0].price;
  let bandNote = "";
  if(bandLow&&bandHigh&&quotePrice!=null){
    if(quotePrice<bandLow) bandNote = `<span style="color:var(--ok)">Below historical band</span>`;
    else if(quotePrice>bandHigh) bandNote = `<span style="color:var(--bad)">Above historical band</span>`;
    else bandNote = `<span style="color:var(--ok)">Within historical band</span>`;
  }

  const histRows = histItems.map(h=>`
    <tr>
      <td class="mono">${esc(h.id)}</td>
      <td>${esc(h.name)}</td>
      <td class="mono">${esc(h.material)}</td>
      <td class="right num">${fmtVol(h.vol)}</td>
      <td class="right num">${fmt$(h.price)}</td>
      <td class="right num">${fmtK(h.tooling)}</td>
      <td class="right num">${esc(h.terms)}</td>
      <td style="text-align:center;font-size:12px;color:${h.award==="Won"?"var(--ok)":"var(--bad)"}"><strong>${h.award}</strong></td>
    </tr>
  `).join("");

  return `
    <div class="quote-header-grid">
      <div class="qhk">
        <div class="ql">Version</div>
        <div class="qv" style="font-size:13px;margin-top:4px">${esc(q.version)}</div>
      </div>
      <div class="qhk">
        <div class="ql">Prepared By</div>
        <div class="qv" style="font-size:13px;margin-top:4px">${esc(q.prepared_by)}</div>
      </div>
      <div class="qhk">
        <div class="ql">Total Tooling</div>
        <div class="qv">${fmtK(q.total_tooling)}</div>
      </div>
      <div class="qhk">
        <div class="ql">Risk Score</div>
        <div class="qv ${rc}">${q.risk_score}/100</div>
      </div>
    </div>

    <p style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);margin-bottom:10px">Line Items</p>
    ${linesHtml}

    <div class="cost-grid">
      <div>
        <p style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);margin-bottom:10px;margin-top:20px">Cost Breakdown</p>
        ${cbHtml}
      </div>
      <div>
        <p style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);margin-bottom:10px;margin-top:20px">Historical Benchmark</p>
        <div class="bench-band">
          <div class="band-item"><div class="bl">Price Band</div><div class="bv num">${fmt$(bandLow)} – ${fmt$(bandHigh)}</div></div>
          <div class="band-arrow">→</div>
          <div class="band-item"><div class="bl">This Quote</div><div class="bv num" style="color:var(--ox)">${fmt$(quotePrice)}</div></div>
          <div class="band-item"><div class="bl">Position</div><div class="bv" style="font-size:13px;margin-top:4px">${bandNote}</div></div>
        </div>
        <div class="bench-band" style="border-top:1px solid var(--rule2)">
          <div class="band-item"><div class="bl">Tooling Band</div><div class="bv num">${fmtK(q.hist_tooling_band&&q.hist_tooling_band[0])} – ${fmtK(q.hist_tooling_band&&q.hist_tooling_band[1])}</div></div>
          <div class="band-arrow">→</div>
          <div class="band-item"><div class="bl">Quoted</div><div class="bv num" style="color:var(--ox)">${fmtK(q.total_tooling)}</div></div>
        </div>
      </div>
    </div>

    <p style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);margin:24px 0 10px">Matched Historical Cases</p>
    <div style="overflow-x:auto">
    <table class="ruled-table">
      <thead>
        <tr>
          <th>Ref</th><th>Part Name</th><th>Material</th>
          <th class="right">Volume</th><th class="right">Price</th>
          <th class="right">Tooling</th><th>Terms</th><th style="text-align:center">Award</th>
        </tr>
      </thead>
      <tbody>${histRows}</tbody>
    </table>
    </div>
  `;
}

/* ════════ MAIN RENDER ════════ */
function renderAll(){
  const c = CASES[currentCase];
  if(!c) return;

  const inner = document.getElementById("main-inner");

  // Document header
  const sc = statusClass(c);
  inner.innerHTML = `
    <div class="doc-header">
      <div class="doc-eyebrow">RFQ Engineering Review · ${esc(c.rfq_num)}</div>
      <div class="doc-title">${esc(c.title)}</div>
      <div class="doc-meta-row">
        <div class="doc-meta-item"><strong>Customer:</strong> ${esc(c.customer)}</div>
        <div class="doc-meta-item"><strong>Program:</strong> ${esc(c.program)}</div>
        <div class="doc-meta-item"><strong>SOP:</strong> ${esc(c.sop)}</div>
        <div class="doc-meta-item"><span class="status-badge ${sc}">${esc(c.status_label)}</span></div>
      </div>
    </div>

    ${SECTIONS.map(s=>`
      <section class="section" id="sec-${s.id}">
        <div class="section-heading">
          <span class="section-num">${s.num}.</span>
          <h2 class="section-title">${s.label}</h2>
        </div>
        <div id="sec-content-${s.id}"></div>
      </section>
    `).join("")}
  `;

  // Render each section content
  document.getElementById("sec-content-overview").innerHTML  = renderOverview(c);
  document.getElementById("sec-content-documents").innerHTML = renderDocuments(c);
  document.getElementById("sec-content-part").innerHTML      = renderPart(c);
  document.getElementById("sec-content-gaps").innerHTML      = renderGaps(c);
  document.getElementById("sec-content-quote").innerHTML     = renderQuote(c);

  // Scroll to top
  document.getElementById("main-scroll").scrollTop = 0;
}

function renderMain(){
  renderAll();
}

/* ════════ INTERACTIONS ════════ */
function toggleFinding(n){
  const el = document.getElementById("finding-"+n);
  if(!el) return;
  const isOpen = el.classList.contains("open");
  el.classList.toggle("open",!isOpen);
  const header = el.querySelector(".finding-header");
  if(header) header.setAttribute("aria-expanded",String(!isOpen));
}

function setGapFilter(sev){
  gapSevFilter = sev;
  // Update filter buttons
  document.querySelectorAll(".sev-btn").forEach(btn=>{
    const cls = btn.textContent.trim().toLowerCase();
    const isOn = cls===sev||(sev==="all"&&cls==="all");
    btn.className = "sev-btn"+(isOn?(" on "+cls):"");
  });
  // Re-render gap body
  const c = CASES[currentCase];
  const gapContent = document.getElementById("sec-content-gaps");
  if(gapContent) gapContent.innerHTML = renderGaps(c);
}

function onGapSearch(ev){
  gapSearchTerm = ev.target.value||"";
  const c = CASES[currentCase];
  const gapContent = document.getElementById("sec-content-gaps");
  if(gapContent) gapContent.innerHTML = renderGaps(c);
}

  buildCaseSwitcher();
  buildTOC();
  renderAll();
  setupScrollSpy();
})();
