<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RFQ Assistant · Triage</title>
<style>
/* ════════ TRIAGE — master/detail inbox · light neutral · teal accent ════════ */
:root{
  --bg:#eef1f3; --surface:#ffffff; --raised:#f6f8f9; --hover:#eef4f4; --selbg:#e3f1f0;
  --line:#e1e6e9; --line2:#cdd5d9;
  --ink:#19222a; --ink2:#566069; --ink3:#8a949c;
  --accent:#2c7a7b; --accent-d:#236162; --accent-soft:#e3f1f0; --accent-line:#b6dad9;
  --high:#a8443a; --high-soft:#f8ebe9; --med:#b07b2f; --med-soft:#f7f0e4; --low:#5a6573; --low-soft:#eef0f2;
  --ok:#2f7d4f; --ok-soft:#e9f4ed;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13.5px}
.num{font-variant-numeric:tabular-nums}
.app{display:flex;flex-direction:column;height:100vh}

/* top header */
.hdr{height:54px;background:var(--accent-d);color:#fff;display:flex;align-items:center;gap:16px;padding:0 18px;flex-shrink:0}
.hdr .brand{font-weight:800;letter-spacing:.02em;font-size:15px}
.hdr .brand b{background:#fff;color:var(--accent-d);border-radius:6px;padding:1px 7px;margin-right:7px}
.case-switch{display:flex;gap:4px;margin-left:8px}
.cs{padding:6px 13px;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;color:#cfe6e5;background:rgba(255,255,255,.08)}
.cs:hover{background:rgba(255,255,255,.16);color:#fff}
.cs.on{background:#fff;color:var(--accent-d)}
.cs .rk{font-family:var(--mono);font-size:10px;opacity:.75;margin-left:5px}
.hdr .right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:12.5px}
.hdr .right .lab{opacity:.7;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.hdr .right .v{font-family:var(--mono);font-weight:700;font-size:14px}
.hdr .pill{font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px;background:rgba(255,255,255,.15)}

/* tab bar */
.tabbar{display:flex;background:var(--surface);border-bottom:1px solid var(--line);padding:0 14px;flex-shrink:0;height:46px;align-items:center;gap:2px}
.tab{padding:0 16px;height:46px;display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--ink2);cursor:pointer;border-bottom:2.5px solid transparent}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab .cnt{font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:20px;background:var(--hover);color:var(--ink2)}
.tab.on .cnt{background:var(--accent-soft);color:var(--accent)}

.body{flex:1;overflow:hidden;min-height:0}
.panel{display:none;height:100%}.panel.on{display:block}
.scroll{height:100%;overflow-y:auto;padding:22px}
.maxw{max-width:1060px}

.sec-lab{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin:22px 0 11px}
.sec-lab:first-child{margin-top:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.card-h{padding:13px 17px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:15px 17px;border-top:3px solid var(--accent)}
.stat .l{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3)}
.stat .v{font-size:27px;font-weight:700;margin-top:7px;letter-spacing:-.02em}
.stat .sub{font-size:12px;color:var(--ink2);margin-top:5px}
.bar{height:6px;border-radius:6px;background:var(--hover);overflow:hidden;margin-top:9px}.bar>i{display:block;height:100%}

/* workflow */
.wf{display:flex;align-items:center;flex-wrap:wrap;padding:16px}
.wf-s{display:flex;align-items:center;gap:8px}
.wf-n{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:1.5px solid var(--line2);color:var(--ink3);background:#fff}
.wf-l{font-size:12px;font-weight:600;color:var(--ink3);white-space:nowrap}
.wf-line{width:30px;height:2px;background:var(--line2);margin:0 9px}
.wf-done .wf-n{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}.wf-done .wf-l{color:var(--ink2)}.wf-line.done{background:var(--ok)}
.wf-active .wf-n{background:var(--accent);border-color:var(--accent);color:#fff}.wf-active .wf-l{color:var(--accent)}

.ig{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.if{background:var(--surface);padding:12px 15px}
.if .l{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.if .v{font-size:13px;font-weight:600}
.if .v.warn{color:var(--med)}.if .v.bad{color:var(--high)}.if .v.ok{color:var(--ok)}

.note{display:flex;gap:11px;padding:12px 15px;border:1px solid var(--line);border-left-width:3px;border-radius:8px;background:var(--surface);margin-bottom:9px}
.note.high{border-left-color:var(--high)}.note.medium{border-left-color:var(--med)}.note.low{border-left-color:var(--low)}
.note .ti{font-weight:700;font-size:13px}.note .tx{font-size:12.5px;color:var(--ink2);margin-top:3px;line-height:1.55}
.note .sv{font-family:var(--mono);font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;height:fit-content}

table.tbl{width:100%;border-collapse:collapse;background:var(--surface)}
.tbl th{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink3);text-align:left;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--raised)}
.tbl td{padding:11px 16px;border-bottom:1px solid var(--line);font-size:13px}
.tbl tr:last-child td{border-bottom:none}.tbl tr:hover td{background:var(--raised)}
.tbl.r th,.tbl.r td{text-align:right}.tbl.r th:first-child,.tbl.r td:first-child,.tbl.r th:nth-child(2),.tbl.r td:nth-child(2){text-align:left}
.dtag{font-family:var(--mono);font-size:11px;padding:2px 9px;border-radius:6px;background:var(--accent-soft);color:var(--accent-d)}
.pst{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600}
.pst .d{width:7px;height:7px;border-radius:50%}.pst.ok{color:var(--ok)}.pst.ok .d{background:var(--ok)}.pst.miss{color:var(--high)}.pst.miss .d{background:var(--high)}
.minibar{display:inline-block;width:54px;height:5px;border-radius:3px;background:var(--hover);overflow:hidden;vertical-align:middle;margin-left:7px}.minibar>i{display:block;height:100%}
.flags{display:flex;gap:8px;flex-wrap:wrap;padding:3px 0}
.flag{font-size:12px;font-weight:600;padding:4px 11px;border-radius:20px}
.flag.y{background:var(--ok-soft);color:var(--ok)}.flag.n{background:var(--high-soft);color:var(--high)}.flag.w{background:var(--med-soft);color:var(--med)}
.flag.t{background:var(--accent-soft);color:var(--accent-d)}

/* ════════ GAP — MASTER/DETAIL INBOX ════════ */
#p-gap{display:none;height:100%}#p-gap.on{display:flex;flex-direction:column}
.gap-toolbar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap;flex-shrink:0}
.gsearch{position:relative;flex:1;min-width:180px;max-width:340px}
.gsearch input{width:100%;padding:8px 10px 8px 32px;border:1px solid var(--line2);border-radius:8px;font-size:13px;font-family:var(--sans);background:var(--surface)}
.gsearch svg{position:absolute;left:9px;top:8px;width:15px;height:15px;color:var(--ink3)}
.fchip{font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;border:1px solid var(--line2);background:var(--surface);color:var(--ink2);cursor:pointer}
.fchip:hover{border-color:var(--accent-line)}
.fchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.split{flex:1;display:flex;min-height:0}
.list-pane{width:420px;min-width:380px;border-right:1px solid var(--line);background:var(--surface);overflow-y:auto;flex-shrink:0}
.li{display:flex;gap:11px;align-items:flex-start;padding:12px 15px;border-bottom:1px solid var(--line);cursor:pointer;border-left:3px solid transparent}
.li:hover{background:var(--hover)}
.li.on{background:var(--selbg);border-left-color:var(--accent)}
.li .sevdot{width:9px;height:9px;border-radius:50%;margin-top:4px;flex-shrink:0}
.li .li-b{flex:1;min-width:0}
.li .li-top{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.li .rcode{font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.li .lpart{font-family:var(--mono);font-size:10px;color:var(--accent-d);background:var(--accent-soft);padding:1px 6px;border-radius:5px;margin-left:auto}
.li .li-ttl{font-size:13px;font-weight:600;line-height:1.35;color:var(--ink)}
.li .li-sub{font-size:11.5px;color:var(--ink3);margin-top:3px;display:flex;gap:8px}
.li .li-sub .imp{color:var(--high);font-weight:600}
.detail-pane{flex:1;overflow-y:auto;padding:24px 28px;min-width:0}
.dh{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
.dh .sevbadge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em}
.dh .rcode{font-family:var(--mono);font-size:12px;color:var(--ink3);background:var(--raised);border:1px solid var(--line);padding:3px 9px;border-radius:6px}
.d-title{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:8px 0 16px;line-height:1.25}
.d-det{font-size:14px;color:var(--ink2);line-height:1.7;margin-bottom:18px}
.d-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:18px}
.d-meta .b{border:1px solid var(--line);border-radius:8px;padding:11px 14px}
.d-meta .l{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);margin-bottom:4px}
.d-meta .v{font-size:13px;font-weight:600}
.d-action{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:9px;padding:14px 16px;margin-bottom:16px}
.d-action .l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-d);margin-bottom:6px}
.d-action p{font-size:13.5px;color:var(--ink2);line-height:1.6}
.d-hist{border:1px solid var(--line);border-radius:9px;overflow:hidden}
.d-hist .hh{background:var(--raised);padding:9px 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3)}
.d-hist .hg{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line)}
.d-hist .hg>div{background:var(--surface);padding:11px 14px}
.d-hist .l{font-size:10px;text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
.d-hist .v{font-family:var(--mono);font-size:13px;font-weight:700}
.dsel{font-size:12.5px;padding:7px 10px;border:1px solid var(--line2);border-radius:7px;background:var(--surface);color:var(--ink2)}

/* quote */
.qhead{display:flex;gap:22px;align-items:center;flex-wrap:wrap;padding:17px}
.qk .l{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
.qk .v{font-family:var(--mono);font-size:15px;font-weight:700;margin-top:3px}.qk .v.big{font-size:20px;color:var(--accent)}
.qsep{width:1px;height:38px;background:var(--line)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.cb-row{display:flex;align-items:center;gap:11px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}.cb-row:last-child{border-bottom:none}
.cb-row .l{color:var(--ink2);width:120px}.cb-row .track{flex:1;height:5px;border-radius:3px;background:var(--hover);overflow:hidden}.cb-row .track>i{display:block;height:100%;background:var(--accent)}
.cb-row .v{font-family:var(--mono);font-weight:600;width:68px;text-align:right}
.bm-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.bm-row:last-child{border-bottom:none}
.bm-row .pj{font-family:var(--mono);font-size:12px;color:var(--accent-d);font-weight:700}.bm-row .meta{flex:1;color:var(--ink2);font-size:12px}.bm-row .pr{font-family:var(--mono);font-weight:700}
.bm-out{font-family:var(--mono);font-size:11px;padding:2px 9px;border-radius:20px}.won{background:var(--ok-soft);color:var(--ok)}.lost{background:var(--high-soft);color:var(--high)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#c6ced2;border-radius:6px;border:2px solid var(--bg)}
.empty{padding:60px 28px;text-align:center;color:var(--ink3)}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <div class="brand"><b>R</b>RFQ Triage</div>
    <div class="case-switch" id="case-switch"></div>
    <div class="right">
      <div><span class="lab">Risk</span> <span class="v" id="h-risk">—</span></div>
      <span class="pill" id="h-status">—</span>
    </div>
  </div>

  <div class="tabbar" id="tabbar">
    <div class="tab on" data-t="overview" onclick="switchTab('overview',this)">Overview</div>
    <div class="tab" data-t="documents" onclick="switchTab('documents',this)">Documents <span class="cnt" id="cnt-doc">—</span></div>
    <div class="tab" data-t="parts" onclick="switchTab('parts',this)">Part Detail</div>
    <div class="tab" data-t="gap" onclick="switchTab('gap',this)">Gap Analysis <span class="cnt" id="cnt-gap">—</span></div>
    <div class="tab" data-t="quote" onclick="switchTab('quote',this)">Quote &amp; Benchmark</div>
  </div>

  <div class="body">
    <div class="panel on" id="p-overview"><div class="scroll"><div id="ov"></div></div></div>
    <div class="panel" id="p-documents"><div class="scroll"><div id="docs"></div></div></div>
    <div class="panel" id="p-parts"><div class="scroll"><div id="parts"></div></div></div>
    <div class="panel" id="p-gap">
      <div class="gap-toolbar" id="gap-toolbar"></div>
      <div class="split">
        <div class="list-pane" id="gap-list"></div>
        <div class="detail-pane" id="gap-detail"></div>
      </div>
    </div>
    <div class="panel" id="p-quote"><div class="scroll"><div id="quote"></div></div></div>
  </div>
</div>

/* Convenience: doc type labels + tag keys shared by all designs */
const DOC_TYPE_LABEL = {rfq:"RFQ Main",cost:"Cost Template",draw:"Drawing",pkg:"Packaging",test:"Test Spec",q:"Questionnaire"};
const CASE_ORDER = ["A","B","C","D"];

/* ═══════ TRIAGE RENDER ENGINE ═══════ */
let CUR='A', SELIDX=0, GFILTER='all', GQ='';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SEV={high:{l:'High',c:'var(--high)',soft:'var(--high-soft)'},medium:{l:'Medium',c:'var(--med)',soft:'var(--med-soft)'},low:{l:'Low',c:'var(--low)',soft:'var(--low-soft)'}};
const sevPill=s=>`background:${SEV[s].soft};color:${SEV[s].c}`;
const riskColor=s=>s>=80?'var(--high)':s>=60?'var(--med)':'var(--ok)';

function renderCaseSwitch(){
  document.getElementById('case-switch').innerHTML=CASE_ORDER.map(k=>{
    const c=CASES[k];
    return `<div class="cs ${k===CUR?'on':''}" onclick="selectCase('${k}')">${c.id.replace('CASE-','Case ')}<span class="rk">${c.risk_score}</span></div>`;
  }).join('');
}
function selectCase(k){CUR=k;SELIDX=0;GFILTER='all';GQ='';renderCaseSwitch();renderAll();}
function switchTab(t,el){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  document.getElementById('p-'+t).classList.add('on');el.classList.add('on');
}
function renderAll(){
  const c=CASES[CUR];
  document.getElementById('h-risk').textContent=c.risk_score+'/100';
  document.getElementById('h-risk').style.color='#fff';
  const st=document.getElementById('h-status');st.textContent=c.status_label;
  const blocked=c.completeness==='incomplete'||c.risk_score>=80;
  st.style.background=blocked?'rgba(168,68,58,.55)':'rgba(47,125,79,.55)';
  const miss=c.docs.filter(d=>d.status==='miss').length;
  document.getElementById('cnt-doc').textContent=c.docs.length+(miss?' · '+miss+'!':'');
  document.getElementById('cnt-gap').textContent=c.gap_findings.length;
  renderOverview(c);renderDocs(c);renderParts(c);renderGap(c);renderQuote(c);
}
function ifield(l,v,cls){return `<div class="if"><div class="l">${l}</div><div class="v ${cls||''}">${esc(v)}</div></div>`;}

function renderOverview(c){
  const miss=c.docs.filter(d=>d.status==='miss').length, pct=Math.round((c.docs.length-miss)/c.docs.length*100);
  const hi=c.gap_findings.filter(f=>f.sev==='high').length, md=c.gap_findings.filter(f=>f.sev==='medium').length;
  const steps=[['Upload','done'],['Parse','done'],['Normalize','done'],['Gap Review','active'],['Quote','idle'],['Submit','idle'],['Outcome','idle']];
  const wf=steps.map((s,i)=>`<div class="wf-s wf-${s[1]}"><div class="wf-n">${i+1}</div><div class="wf-l">${s[0]}</div></div>${i<steps.length-1?`<div class="wf-line ${s[1]==='done'?'done':''}"></div>`:''}`).join('');
  const notes=NOTES[CUR]||[];
  document.getElementById('ov').innerHTML=`
    <div class="card" style="margin-bottom:18px"><div class="wf">${wf}</div></div>
    <div class="stats">
      <div class="stat"><div class="l">Completeness</div><div class="v">${pct}%</div><div class="bar"><i style="width:${pct}%;background:${pct>=85?'var(--ok)':pct>=60?'var(--med)':'var(--high)'}"></i></div><div class="sub">${c.docs.length-miss}/${c.docs.length} docs${miss?' · '+miss+' missing':''}</div></div>
      <div class="stat"><div class="l">Open Findings</div><div class="v">${c.gap_findings.length}</div><div class="sub">${hi} high · ${md} medium</div></div>
      <div class="stat"><div class="l">Risk Score</div><div class="v" style="color:${riskColor(c.risk_score)}">${c.risk_score}<span style="font-size:15px;color:var(--ink3)">/100</span></div><div class="sub">${c.risk_score>=80?'Management review':c.risk_score>=60?'Elevated':'Low'}</div></div>
      <div class="stat"><div class="l">Rules Triggered</div><div class="v">${c.triggered_rules.length}</div><div class="sub">of ${Object.keys(RULE_CATALOG).length}</div></div>
    </div>
    <div class="sec-lab">RFQ Header — Extracted Terms</div>
    <div class="ig">
      ${ifield('Customer',c.customer)}${ifield('Program',c.program)}${ifield('Part Number',c.part_number)}${ifield('SOP Date',c.sop)}
      ${ifield('Annual Volume',c.annual_vol.toLocaleString()+' pcs')}${ifield('Material',c.material+' · '+c.thickness+'mm')}
      ${ifield('PPAP','L'+c.ppap,c.ppap>=5?'bad':'')}${ifield('Incoterm',c.incoterm,c.incoterm.startsWith('DDP')?'warn':'')}
      ${ifield('Payment',c.payment,c.payment.includes('120')?'bad':c.payment.includes('75')?'warn':'')}${ifield('Annual Price Down',c.apd+'%/yr',c.apd>=4?'bad':c.apd>=3?'warn':'')}
      ${ifield('Tolerance',c.tolerance,c.tolerance.includes('0.03')?'warn':'')}${ifield('Cpk Target',c.cpk)}
    </div>
    <div class="sec-lab">Extracted Risk Notes</div>
    ${notes.map(n=>`<div class="note ${n.sev}"><div style="flex:1"><div class="ti">${esc(n.ti)}</div><div class="tx">${esc(n.tx)}</div></div><span class="sv" style="${sevPill(n.sev)}">${SEV[n.sev].l.toUpperCase()}</span></div>`).join('')}
  `;
}

function renderDocs(c){
  const miss=c.docs.filter(d=>d.status==='miss').length;
  document.getElementById('docs').innerHTML=`
    <div class="sec-lab">Package Files — ${c.docs.length} Documents${miss?' · '+miss+' missing':''}</div>
    <div class="card" style="overflow:hidden">
      <table class="tbl"><thead><tr><th>File Name</th><th>Type</th><th>Status</th><th>Confidence</th><th>Notes</th></tr></thead><tbody>
      ${c.docs.map(d=>{const conf=d.conf!=null?`<span class="num" style="color:${d.conf>=0.9?'var(--ok)':'var(--med)'};font-weight:600">${d.conf.toFixed(2)}</span><span class="minibar"><i style="width:${d.conf*100}%;background:${d.conf>=0.9?'var(--ok)':'var(--med)'}"></i></span>`:'<span style="color:var(--ink3)">—</span>';
        return `<tr><td style="font-weight:600;color:${d.status==='miss'?'var(--high)':'var(--ink)'}">${d.status==='miss'?'⚠ ':''}${esc(d.name)}</td><td><span class="dtag">${DOC_TYPE_LABEL[d.type]||d.type}</span></td><td><span class="pst ${d.status==='ok'?'ok':'miss'}"><span class="d"></span>${d.status==='ok'?'Parsed':'Missing'}</span></td><td>${conf}</td><td style="color:var(--ink2);font-size:12.5px">${esc(d.note)}</td></tr>`;}).join('')}
      </tbody></table>
    </div>
    <div class="card" style="margin-top:13px;padding:13px 17px;font-size:13px;color:var(--ink2)"><b style="color:${miss>=2?'var(--high)':miss===1?'var(--med)':'var(--ok)'}">Completeness risk: ${miss>=2?'HIGH':miss===1?'MEDIUM':'LOW'}</b> — ${miss===0?'All referenced documents received and parsed.':miss+' referenced document'+(miss>1?'s':'')+' missing. '+(miss>=2?'Quote release blocked until resolved.':'Address before release.')}</div>`;
}

function renderParts(c){
  document.getElementById('parts').innerHTML=`
    <div class="sec-lab">Part Technical Data — ${esc(c.part_number)}</div>
    <div class="card">
      <div class="card-h">${esc(c.title)} ${c.multi_part?'<span class="dtag" style="margin-left:8px">'+c.sub_parts.length+' sub-parts</span>':''}</div>
      <div class="ig" style="border:none;border-radius:0">
        ${ifield('Customer',c.customer)}${ifield('Program',c.program)}${ifield('SOP Date',c.sop)}${ifield('Annual Volume',c.annual_vol.toLocaleString())}

        ${ifield('General Tol.',c.tolerance,c.tolerance.includes('0.03')?'bad':'')}${ifield('Critical Tol.',c.critical_tol,(c.critical_tol.includes('0.10')||c.critical_tol.includes('0.03'))?'bad':'')}

      </div>
      <div style="padding:13px 17px;border-top:1px solid var(--line)"><div class="sec-lab" style="margin:0 0 9px">Process Route</div><div style="font-size:13px;color:var(--ink2);font-family:var(--mono)">${c.process.join('  →  ')}</div></div>
      ${c.multi_part?`<div style="padding:13px 17px;border-top:1px solid var(--line)"><div class="sec-lab" style="margin:0 0 9px">Sub-Parts</div><div class="flags">${c.sub_parts.map(p=>`<span class="flag t">${esc(p)}</span>`).join('')}</div></div>`:''}
      <div style="padding:13px 17px;border-top:1px solid var(--line)"><div class="sec-lab" style="margin:0 0 9px">Surface Requirements</div><div class="flags">${c.surface.map(s=>`<span class="flag y">${esc(s)}</span>`).join('')}</div></div>

        ${c.supplier_funded_gauges?'<span class="flag w">Supplier Gauges</span>':''}${c.incoterm.startsWith('DDP')?'<span class="flag w">DDP Freight</span>':''}
        <span class="flag ${c.apd>=4?'n':c.apd>=3?'w':'y'}">${c.apd}% APD</span><span class="flag ${c.payment.includes('120')?'n':c.payment.includes('60')||c.payment.includes('75')?'y':'w'}">${c.payment}</span>
      </div></div>
    </div>`;
}

/* ── GAP master/detail ── */
function gapFiltered(c){
  return c.gap_findings.map((f,i)=>({f,i})).filter(({f})=>{
    if(GFILTER==='high'||GFILTER==='medium'||GFILTER==='low'){if(f.sev!==GFILTER)return false;}
    else if(GFILTER.startsWith('cat:')){if(f.cat!==GFILTER.slice(4))return false;}
    if(GQ){const t=(f.title+' '+f.rule+' '+(f.part||'')+' '+f.detail).toLowerCase();if(!t.includes(GQ))return false;}
    return true;
  });
}
function renderGap(c){
  const cnt=s=>c.gap_findings.filter(x=>x.sev===s).length;
  const cats=[...new Set(c.gap_findings.map(x=>x.cat))];
  document.getElementById('gap-toolbar').innerHTML=`
    <div class="gsearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg><input id="gq" placeholder="Search ${c.gap_findings.length} findings…" oninput="onSearch(this.value)" value="${esc(GQ)}"></div>
    <div class="fchip ${GFILTER==='all'?'on':''}" onclick="setF('all')">All ${c.gap_findings.length}</div>
    <div class="fchip ${GFILTER==='high'?'on':''}" onclick="setF('high')">High ${cnt('high')}</div>
    <div class="fchip ${GFILTER==='medium'?'on':''}" onclick="setF('medium')">Medium ${cnt('medium')}</div>
    ${cnt('low')?`<div class="fchip ${GFILTER==='low'?'on':''}" onclick="setF('low')">Low ${cnt('low')}</div>`:''}
    ${cats.map(ct=>`<div class="fchip ${GFILTER==='cat:'+ct?'on':''}" onclick="setF('cat:${ct}')">${ct[0].toUpperCase()+ct.slice(1)}</div>`).join('')}`;
  renderGapList(c);
}
function setF(f){GFILTER=f;SELIDX=null;renderGap(CASES[CUR]);}
function onSearch(v){GQ=v.toLowerCase().trim();SELIDX=null;renderGapList(CASES[CUR]);}
function renderGapList(c){
  const rows=gapFiltered(c);
  const lp=document.getElementById('gap-list');
  if(!rows.length){lp.innerHTML='<div class="empty">No findings match.</div>';document.getElementById('gap-detail').innerHTML='<div class="empty">—</div>';return;}
  if(SELIDX===null||!rows.some(r=>r.i===SELIDX))SELIDX=rows[0].i;
  lp.innerHTML=rows.map(({f,i})=>`
    <div class="li ${i===SELIDX?'on':''}" onclick="selFinding(${i})">
      <span class="sevdot" style="background:${SEV[f.sev].c}"></span>
      <div class="li-b">
        <div class="li-top"><span class="rcode">${f.rule}</span>${f.part?`<span class="lpart">${esc(f.part)}</span>`:''}</div>
        <div class="li-ttl">${esc(f.title)}</div>
        <div class="li-sub"><span style="text-transform:capitalize">${esc(f.cat)}</span><span class="imp">${esc(f.impact)}</span></div>
      </div>
    </div>`).join('');
  renderGapDetail(c);
}
function selFinding(i){SELIDX=i;renderGapList(CASES[CUR]);}
function renderGapDetail(c){
  const f=c.gap_findings[SELIDX];if(!f){document.getElementById('gap-detail').innerHTML='<div class="empty">Select a finding.</div>';return;}
  const hist=f.hist?`<div class="d-hist"><div class="hh">Historical Benchmark — ${f.hist.projects.join(', ')}</div><div class="hg">

      <div><div class="l">Projects</div><div class="v">${f.hist.projects.length}</div></div></div></div>`:'';
  document.getElementById('gap-detail').innerHTML=`

}

function renderQuote(c){
  const q=c.quote,hist=HISTORICAL.filter(h=>q.hist_match.includes(h.id)).slice(0,3),cb=q.cost_breakdown;
  const maxV=Math.max(...Object.entries(cb).filter(([k])=>k!=='total').map(([,v])=>v));
  const totalVal=q.lines.reduce((a,l)=>a+l.price*l.vol,0);
  const lines=q.lines.map(l=>`<tr><td style="color:var(--accent-d);font-weight:600;font-family:var(--mono)">${esc(l.pn)}</td><td style="color:var(--ink2)">${esc(l.name)}</td><td class="num">${l.vol.toLocaleString()}</td><td class="num">$${l.price.toFixed(2)}</td><td class="num">$${l.tooling.toLocaleString()}</td><td class="num" style="color:${l.pkg===0?'var(--high)':'var(--ink)'}">$${l.pkg.toFixed(2)}${l.pkg===0?' ⚠':''}</td><td class="num">$${l.quality.toFixed(2)}</td><td class="num" style="color:${l.margin>=15?'var(--ok)':l.margin>=12?'var(--med)':'var(--high)'};font-weight:600">${l.margin.toFixed(1)}%</td></tr>`).join('');
  const cbl={material:'Material',labor:'Labor',machine:'Machine',overhead:'Overhead',scrap:'Scrap',quality:'Quality / PPAP',logistics:'Logistics',packaging:'Packaging'};
  document.getElementById('quote').innerHTML=`
    <div class="card qhead">
      <div class="qk"><div class="l">Version</div><div class="v">${esc(q.version)}</div></div><div class="qsep"></div>
      <div class="qk"><div class="l">Prepared By</div><div class="v">${esc(q.prepared_by)}</div></div><div class="qsep"></div>
      <div class="qk"><div class="l">Tooling (est.)</div><div class="v">$${q.total_tooling.toLocaleString()}</div></div><div class="qsep"></div>
      <div class="qk"><div class="l">Est. Annual Rev.</div><div class="v big">$${Math.round(totalVal).toLocaleString()}</div></div><div class="qsep"></div>
      <div class="qk"><div class="l">Risk</div><div class="v big" style="color:${riskColor(q.risk_score)}">${q.risk_score}/100</div></div>
    </div>
    <div class="sec-lab">Quote Line Items${q.lines.length>1?' — '+q.lines.length+' sub-parts':''}</div>
    <div class="card" style="overflow-x:auto"><table class="tbl r"><thead><tr><th>Part No.</th><th>Description</th><th>Volume</th><th>Unit Price</th><th>Tooling</th><th>Pkg/pc</th><th>Qual/pc</th><th>Margin</th></tr></thead><tbody>${lines}</tbody></table></div>
    <div class="cols2" style="margin-top:15px">
      <div class="card"><div class="card-h">Cost Breakdown — USD/pc${q.lines.length>1?' (assembly)':''}</div><div style="padding:14px 17px">
        ${Object.entries(cbl).map(([k,lab])=>{const v=cb[k];const w=(k==='packaging'&&v===0)||(k==='logistics'&&v===0&&c.incoterm.startsWith('DDP'));return `<div class="cb-row"><span class="l">${lab}</span><span class="track"><i style="width:${Math.min(100,v/maxV*100)}%;background:${w?'var(--high)':'var(--accent)'}"></i></span><span class="v" style="color:${w?'var(--high)':'var(--ink)'}">${w?'⚠':''}$${v.toFixed(2)}</span></div>`;}).join('')}
        <div class="cb-row" style="font-weight:700"><span class="l">Total Cost</span><span class="track"></span><span class="v">$${cb.total.toFixed(2)}</span></div>
      </div></div>
      <div class="card"><div class="card-h">Historical Benchmark — ${q.hist_match.length} matched</div><div style="padding:14px 17px">
        ${hist.map(h=>`<div class="bm-row"><span class="pj">${h.id}</span><span class="meta">${esc(h.pn)} · ${esc(h.material)} · ${h.vol.toLocaleString()} pcs</span><span class="pr">$${h.price.toFixed(2)}</span><span class="bm-out ${h.award==='Won'?'won':'lost'}">${h.award}</span></div>`).join('')}
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:13px">
          <div><div class="l" style="font-size:10px;text-transform:uppercase;color:var(--ink3);margin-bottom:4px">Hist. Price Band</div><div class="num" style="font-size:16px;font-weight:700;color:var(--ok)">$${q.hist_price_band[0].toFixed(2)} – $${q.hist_price_band[1].toFixed(2)}</div></div>
          <div><div class="l" style="font-size:10px;text-transform:uppercase;color:var(--ink3);margin-bottom:4px">Hist. Tooling Band</div><div class="num" style="font-size:16px;font-weight:700;color:var(--ok)">$${(q.hist_tooling_band[0]/1000).toFixed(0)}K – $${(q.hist_tooling_band[1]/1000).toFixed(0)}K</div></div>
        </div>
        ${c.risk_score>=60?`<div style="margin-top:13px;background:var(--high-soft);border:1px solid #e6c9c4;border-radius:8px;padding:12px 14px;font-size:13px;color:var(--ink2)"><b style="color:var(--high)">Risk flag</b> — ${c.completeness==='incomplete'?'Quote blocked — missing specs must be resolved first. Benchmark is reference only.':'Multiple cost gaps detected. Corrected cost is materially higher than the current draft. Management review required.'}</div>`:''}
      </div></div>
    </div>`;
}

const NOTES={
  A:[{sev:'medium',ti:'Annual price reduction',tx:'2% annual reduction after Year 1 must be modeled. At 180K units and $4.08 launch, ~5-year cumulative impact ≈ $160K.'},
     {sev:'low',ti:'Package complete',tx:'All required documents received and parsed. Minor packaging cost gap (RULE_019) resolvable before release.'}],
  B:[{sev:'high',ti:'Incomplete package — quote blocked',tx:'Packaging spec and DV/PV test standard both missing. Two blocking gaps must be resolved before release.'},
     {sev:'medium',ti:'Appearance approval timeline risk',tx:'Appearance sample approval required prior to PPAP — not in the current program plan; may impact SOP.'}],
  C:[{sev:'high',ti:'High risk — management review required',tx:'Risk 89/100. 14 rules triggered. DDP Monterrey, Net 120, PPAP L5, supplier gauges and 4% APD all above family norm.'},
     {sev:'high',ti:'DDP Monterrey logistics gap',tx:'Logistics in template is at FOB rate. DDP requires a full rebuild: freight, customs, brokerage, volatility buffer.'},
     {sev:'high',ti:'4% APD over program life',tx:'At $6.18 launch, year-5 effective ≈ $5.05 after 4% compounding. Validate margin floor at year 5, not just launch.'}],
  D:[{sev:'high',ti:'Critical multi-part RFQ — 46 open gaps',tx:'Risk 94/100. Aluminium assembly with 6 sub-parts. Weld spec, leak-test standard and packaging spec all missing; capacity flagged below volume.'},
     {sev:'high',ti:'No historical cost anchor',tx:'AA5754 pan and AA6082 cross member are new materials/processes vs the steel family. Cost must be built bottom-up.'},
     {sev:'high',ti:'DDP Stuttgart + Net 120 on high-value assembly',tx:'Intercontinental DDP on a bulky aluminium tray plus Net 120 on ~$1.7M+ annual revenue — material logistics and financing exposure.'}]
};

renderCaseSwitch();
renderAll();
</script>
