<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RFQ Console · Workstation</title>
<style>
/* ── CONSOLE DESIGN TOKENS ── */
:root{
  --canvas:#f7f8fa;
  --surface:#ffffff;
  --raised:#f2f4f7;
  --hover:#eef0f4;
  --border:#dde1e7;
  --border2:#c8cdd6;
  --ink:#1c2330;
  --ink2:#5b6576;
  --ink3:#8e97a6;
  --slate:#475569;
  --slate-soft:#eef0f4;
  --slate-line:#c5cad4;
  --ok:#2f7d4f; --ok-soft:#edf7f2; --ok-line:#b0d9c3;
  --warn:#b07b2f; --warn-soft:#fdf6ea; --warn-line:#e8c98a;
  --bad:#a8443a; --bad-soft:#fdf0ef; --bad-line:#e4b0ac;
  --low:#6b7280; --low-soft:#f3f4f6;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.4}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit}

/* ── LAYOUT ── */
.app{display:flex;height:100vh;overflow:hidden}

/* Case list sidebar */
.sidebar{width:200px;min-width:200px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-hd{padding:14px 14px 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.sidebar-hd .logo{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);margin-bottom:1px}
.sidebar-hd .sub{font-size:10px;color:var(--ink3);letter-spacing:.04em}
.sidebar-cases{flex:1;overflow-y:auto;padding:6px 0}
.case-row{padding:9px 14px;cursor:pointer;border-left:2px solid transparent;display:flex;flex-direction:column;gap:3px;transition:background .1s}
.case-row:hover{background:var(--hover)}
.case-row.active{background:var(--slate-soft);border-left-color:var(--slate)}
.cr-top{display:flex;align-items:center;gap:6px}
.cr-id{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--slate);letter-spacing:.05em}
.cr-risk{margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:700;padding:1px 6px;border-radius:2px}
.cr-name{font-size:11.5px;font-weight:600;color:var(--ink);line-height:1.3}
.cr-meta{font-size:10px;color:var(--ink3)}
.sidebar-footer{padding:10px 14px;border-top:1px solid var(--border);font-size:10px;color:var(--ink3);flex-shrink:0}

/* Main workspace */
.workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* Case header bar */
.case-header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;flex-shrink:0}
.ch-top{display:flex;align-items:center;gap:14px;padding:10px 0 0}
.ch-title{font-size:15px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-rfq{font-family:var(--mono);font-size:10px;color:var(--ink3);flex-shrink:0}
.ch-kpis{display:flex;gap:0;flex-shrink:0}
.kpi{padding:0 14px;text-align:right;border-left:1px solid var(--border)}
.kpi:first-child{border-left:none}
.kpi .kl{font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.kpi .kv{font-family:var(--mono);font-size:17px;font-weight:700;letter-spacing:-.01em}

/* Tab strip */
.tab-strip{display:flex;gap:0;margin-top:8px}
.tab-btn{padding:7px 14px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;letter-spacing:.01em}
.tab-btn:hover{color:var(--ink);background:var(--hover)}
.tab-btn.active{color:var(--slate);border-bottom-color:var(--slate)}
.tab-btn .tc{font-family:var(--mono);font-size:10px;margin-left:5px;color:var(--ink3);background:var(--raised);padding:1px 5px;border-radius:2px}
.tab-btn.active .tc{background:var(--slate-soft);color:var(--slate)}

/* Content area */
.content{flex:1;overflow-y:auto;padding:0;min-width:0}
.panel{display:none;padding:16px 20px}
.panel.active{display:block}

/* ── GENERIC TABLE ── */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:2px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);padding:7px 12px;text-align:left;background:var(--raised);border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;z-index:1}
thead th.r{text-align:right}
tbody td{padding:7px 12px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--ink)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--hover)}
tbody td.r{text-align:right;font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
tbody td.mono{font-family:var(--mono);font-size:11px}

/* ── SECTION STRUCTURE ── */
.sec{margin-bottom:18px}
.sec-head{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

/* ── KPI STAT TILES ── */
.stat-tile{background:var(--surface);border:1px solid var(--border);padding:11px 14px}
.st-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);margin-bottom:5px}
.st-val{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1}
.st-sub{font-size:11px;color:var(--ink2);margin-top:5px}
.st-bar{height:3px;background:var(--border);margin-top:8px;border-radius:1px;overflow:hidden}
.st-bar i{display:block;height:100%}

/* ── FIELD GRID (key-value pairs) ── */
.field-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border)}
.field{background:var(--surface);padding:8px 12px}
.field .fl{font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.field .fv{font-size:12px;font-weight:600;color:var(--ink)}
.field .fv.warn{color:var(--warn)}
.field .fv.bad{color:var(--bad)}
.field .fv.ok{color:var(--ok)}
.field.wide{grid-column:span 2}

/* ── SEVERITY CHIPS ── */
.sev{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:1px;text-transform:uppercase;white-space:nowrap}
.sev-H{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad-line)}
.sev-M{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-line)}
.sev-L{background:var(--low-soft);color:var(--low);border:1px solid var(--border)}
.sev-dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sev-dot-H{background:var(--bad)}
.sev-dot-M{background:var(--warn)}
.sev-dot-L{background:var(--low)}

/* ── STATUS CHIPS ── */
.status-chip{font-size:10px;font-weight:700;padding:2px 8px;border-radius:1px;letter-spacing:.04em;white-space:nowrap}
.sc-ok{background:var(--ok-soft);color:var(--ok)}
.sc-warn{background:var(--warn-soft);color:var(--warn)}
.sc-bad{background:var(--bad-soft);color:var(--bad)}
.sc-slate{background:var(--slate-soft);color:var(--slate)}

/* ── WORKFLOW STEPS ── */
.wf-strip{display:flex;align-items:center;gap:0;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:2px;overflow-x:auto}
.wf-step{display:flex;align-items:center;gap:6px;white-space:nowrap;flex-shrink:0}
.wf-num{width:20px;height:20px;border-radius:50%;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--border2);color:var(--ink3);background:var(--surface)}
.wf-lbl{font-size:11px;font-weight:600;color:var(--ink3)}
.wf-step.done .wf-num{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.wf-step.done .wf-lbl{color:var(--ink2)}
.wf-step.active .wf-num{background:var(--slate);border-color:var(--slate);color:#fff}
.wf-step.active .wf-lbl{color:var(--slate);font-weight:700}
.wf-line{width:28px;height:1px;background:var(--border2);margin:0 4px;flex-shrink:0}
.wf-line.done{background:var(--ok)}

/* ── DOC STATUS ── */
.doc-ok{color:var(--ok);font-weight:600}
.doc-miss{color:var(--bad);font-weight:600}
.conf-bar{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.conf-track{width:44px;height:4px;background:var(--border);border-radius:1px;overflow:hidden;display:inline-block;vertical-align:middle}
.conf-fill{height:100%;border-radius:1px}

/* ── GAP TABLE ── */
.gap-toolbar{display:flex;align-items:center;gap:8px;padding:8px 0 10px;flex-wrap:wrap}
.gap-search{padding:5px 9px;border:1px solid var(--border);border-radius:2px;font-size:12px;width:200px;background:var(--surface);color:var(--ink);outline:none}
.gap-search:focus{border-color:var(--slate)}
.gap-select{padding:5px 8px;border:1px solid var(--border);border-radius:2px;font-size:12px;background:var(--surface);color:var(--ink);cursor:pointer;outline:none}
.gap-select:focus{border-color:var(--slate)}
.gap-count{font-size:11px;color:var(--ink3);margin-left:auto;font-variant-numeric:tabular-nums}

/* Gap accordion table */
.gap-tbl-wrap{border:1px solid var(--border);border-radius:2px;overflow:hidden}
.gap-tbl{width:100%;border-collapse:collapse;font-size:12px}
.gap-tbl thead th{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);padding:7px 10px;background:var(--raised);border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;z-index:2}
.gap-tbl thead th:hover{background:var(--hover)}
.gap-tbl thead th .sort-ind{font-size:9px;color:var(--ink3);margin-left:3px}
.gap-tbl tbody .gap-row{cursor:pointer}
.gap-tbl tbody .gap-row:hover td{background:var(--hover)}
.gap-tbl tbody .gap-row.expanded{background:var(--slate-soft)}
.gap-tbl tbody .gap-row.expanded td{border-bottom:none}
.gap-tbl tbody td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.gap-tbl .gap-detail-row{display:none}
.gap-tbl .gap-detail-row.open{display:table-row}
.gap-tbl .gap-detail-row td{padding:0;border-bottom:1px solid var(--border)}
.gap-detail-inner{padding:12px 14px 14px;background:var(--slate-soft);border-top:1px solid var(--slate-line);display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gd-block .gdl{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px}
.gd-block .gdt{font-size:12px;color:var(--ink);line-height:1.55}
.gd-hist{grid-column:span 2;display:flex;gap:24px;padding-top:10px;border-top:1px solid var(--slate-line);margin-top:4px}
.gd-hist .gh-item{display:flex;flex-direction:column;gap:2px}
.gd-hist .ghl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
.gd-hist .ghv{font-size:12px;font-weight:600;color:var(--ink)}
.ghv.diff{color:var(--bad)}
.row-expand-icon{font-size:9px;color:var(--ink3);margin-right:4px;display:inline-block;transition:transform .15s}
.expanded .row-expand-icon{transform:rotate(90deg)}

/* ── QUOTE PANEL ── */
.quote-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.cost-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hist-table .price-band{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:1px;background:var(--slate-soft);color:var(--slate)}
.band-ok{background:var(--ok-soft)!important;color:var(--ok)!important}
.band-warn{background:var(--warn-soft)!important;color:var(--warn)!important}
.band-bad{background:var(--bad-soft)!important;color:var(--bad)!important}

/* ── PART DETAIL ── */
.process-chain{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0}
.proc-step{font-size:11px;font-weight:600;padding:4px 10px;border:1px solid var(--border2);border-radius:2px;background:var(--surface);color:var(--ink2);display:flex;align-items:center;gap:6px}
.proc-arrow{color:var(--border2);font-size:12px}
.subpart-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.subpart-card{border:1px solid var(--border);padding:9px 12px;background:var(--surface)}
.spc-idx{font-size:10px;font-weight:700;color:var(--ink3);margin-bottom:3px;font-variant-numeric:tabular-nums}
.spc-name{font-size:12px;font-weight:600;color:var(--ink)}

/* ── RISK INDICATOR ── */
.risk-bar-wrap{display:flex;align-items:center;gap:10px}
.risk-track{flex:1;height:6px;background:var(--border);border-radius:1px;overflow:hidden;max-width:120px}
.risk-fill{height:100%}

/* ── SCROLLBAR STYLE ── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── MISC ── */
.tag{font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:1px;background:var(--raised);color:var(--ink2);border:1px solid var(--border)}
.rule-tag{font-family:var(--mono);font-size:10px;color:var(--slate);font-weight:600}
.flag-inline{font-size:10px;font-weight:700;padding:2px 7px;border-radius:1px;border:1px solid}
.fi-ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.fi-warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.fi-bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-line)}
.empty{text-align:center;padding:32px;font-size:12px;color:var(--ink3)}
.inline-rule{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--slate)}
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-hd">
      <div class="logo">RFQ CONSOLE</div>
      <div class="sub">Supplier Workstation</div>
    </div>
    <div class="sidebar-cases" id="caseList"></div>
    <div class="sidebar-footer">NorthBridge Automotive · 2025</div>
  </div>

  <!-- WORKSPACE -->
  <div class="workspace">
    <div class="case-header">
      <div class="ch-top">
        <div>
          <div class="ch-title" id="hdrTitle"></div>
          <div style="display:flex;align-items:center;gap:10px;margin-top:2px">
            <span class="ch-rfq" id="hdrRfq"></span>
            <span id="hdrStatus"></span>
          </div>
        </div>
        <div class="ch-kpis" id="hdrKpis"></div>
      </div>
      <div class="tab-strip" id="tabStrip">
        <button class="tab-btn active" data-tab="overview">Overview</button>
        <button class="tab-btn" data-tab="documents">Documents <span class="tc" id="tc-documents"></span></button>
        <button class="tab-btn" data-tab="part">Part Detail</button>
        <button class="tab-btn" data-tab="gaps">Gap Analysis <span class="tc" id="tc-gaps"></span></button>
        <button class="tab-btn" data-tab="quote">Quote &amp; Benchmark</button>
      </div>
    </div>

    <div class="content">
      <div class="panel active" id="panel-overview"></div>
      <div class="panel" id="panel-documents"></div>
      <div class="panel" id="panel-part"></div>
      <div class="panel" id="panel-gaps"></div>
      <div class="panel" id="panel-quote"></div>
    </div>
  </div>
</div>

const CASES = {
  A: {
    id:"CASE-A", rfq_num:"RFQ-2025-0437", title:"Front Seat Reinforcement Bracket",

let currentCase = "A";
let gapSortCol = "sev";
let gapSortDir = 1; // 1=asc, -1=desc
let gapFilter = {sev:"all", part:"all", search:""};

const SEV_ORDER = {high:0, medium:1, low:2};
const SEV_LABEL = {high:"HIGH", medium:"MED", low:"LOW"};
const SEV_CLASS = {high:"sev-H", medium:"sev-M", low:"sev-L"};
const SEV_DOT   = {high:"sev-dot-H", medium:"sev-dot-M", low:"sev-dot-L"};

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmt$(n){ return n==null?"—":"$"+Number(n).toFixed(2); }
function fmtK(n){ return n==null?"—":"$"+Math.round(n/1000)+"K"; }
function fmtPct(n){ return n==null?"—":n+"%"; }
function fmtVol(n){ return n==null?"—":Number(n).toLocaleString(); }

function riskClass(r){
  if(r>=80) return "fi-bad";
  if(r>=50) return "fi-warn";
  return "fi-ok";
}
function riskColor(r){
  if(r>=80) return "var(--bad)";
  if(r>=50) return "var(--warn)";
  return "var(--ok)";
}

/* ── Build sidebar case list ── */
function buildSidebar(){
  const el = document.getElementById("caseList");
  el.innerHTML = CASE_ORDER.map(k=>{
    const c = CASES[k];
    const rc = riskClass(c.risk_score);
    return `<div class="case-row${currentCase===k?" active":""}" data-case="${k}" onclick="selectCase('${k}')">
      <div class="cr-top">
        <span class="cr-id">${esc(c.id)}</span>
        <span class="cr-risk ${rc} status-chip num">${c.risk_score}</span>
      </div>
      <div class="cr-name">${esc(c.title)}</div>
      <div class="cr-meta">${esc(c.part_number)}</div>
    </div>`;
  }).join("");
}

/* ── Build case header ── */
function buildHeader(){
  const c = CASES[currentCase];
  document.getElementById("hdrTitle").textContent = c.title;
  document.getElementById("hdrRfq").textContent = c.rfq_num;

  const scClass = c.risk_score>=80?"sc-bad": c.risk_score>=50?"sc-warn":"sc-ok";
  document.getElementById("hdrStatus").innerHTML =
    `<span class="status-chip ${scClass}">${esc(c.status_label)}</span>`;

  const gaps = c.gap_findings.length;
  const highGaps = c.gap_findings.filter(g=>g.sev==="high").length;
  const missing = c.docs.filter(d=>d.status==="miss").length;

  document.getElementById("hdrKpis").innerHTML = `
    <div class="kpi">
      <div class="kl">Completeness</div>
      <div class="kv num" style="color:${c.completeness==='complete'?'var(--ok)':'var(--warn)'}">${c.completeness==='complete'?'100%':Math.round((c.docs.filter(d=>d.status==='ok').length/c.docs.length)*100)+'%'}</div>

    <div class="kpi">
      <div class="kl">Open Findings</div>
      <div class="kv num" style="color:${gaps>10?'var(--bad)':gaps>4?'var(--warn)':'var(--ok)'}">${gaps}</div>
    </div>
    <div class="kpi">
      <div class="kl">High Severity</div>
      <div class="kv num" style="color:${highGaps>0?'var(--bad)':'var(--ok)'}">${highGaps}</div>
    </div>
    <div class="kpi">
      <div class="kl">Risk Score</div>
      <div class="kv num" style="color:${riskColor(c.risk_score)}">${c.risk_score}</div>
    </div>
    <div class="kpi">
      <div class="kl">Missing Docs</div>
      <div class="kv num" style="color:${missing>0?'var(--bad)':'var(--ok)'}">${missing}</div>
    </div>`;

  // Tab counts
  document.getElementById("tc-documents").textContent = c.docs.length;
  document.getElementById("tc-gaps").textContent = gaps;
}

/* ── GAP ANALYSIS TAB ── */
function renderGaps(){
  const c = CASES[currentCase];
  const isMulti = !!c.multi_part;
  const el = document.getElementById("panel-gaps");

  // Collect unique parts for filter
  const parts = isMulti ? [...new Set(c.gap_findings.map(g=>g.part).filter(Boolean))] : [];

  el.innerHTML = `
    <div class="gap-toolbar">
      <input class="gap-search" id="gapSearch" type="search" placeholder="Search findings…" value="${esc(gapFilter.search)}" oninput="updateGapFilter('search',this.value)">
      <select class="gap-select" id="gapSev" onchange="updateGapFilter('sev',this.value)">
        <option value="all"${gapFilter.sev==='all'?' selected':''}>All severities</option>
        <option value="high"${gapFilter.sev==='high'?' selected':''}>High only</option>
        <option value="medium"${gapFilter.sev==='medium'?' selected':''}>Medium only</option>
        <option value="low"${gapFilter.sev==='low'?' selected':''}>Low only</option>
      </select>
      ${isMulti?`<select class="gap-select" id="gapPart" onchange="updateGapFilter('part',this.value)">
        <option value="all"${gapFilter.part==='all'?' selected':''}>All parts</option>
        ${parts.map(p=>`<option value="${esc(p)}"${gapFilter.part===p?' selected':''}>${esc(p)}</option>`).join("")}
      </select>`:""}
      <span class="gap-count" id="gapCountLabel"></span>
    </div>
    <div class="gap-tbl-wrap">
      <table class="gap-tbl" id="gapTable">
        <thead>
          <tr>
            <th style="width:28px"></th>
            <th onclick="sortGaps('sev')" title="Sort by severity">Sev <span class="sort-ind" id="si-sev"></span></th>
            <th onclick="sortGaps('rule')" title="Sort by rule">Rule <span class="sort-ind" id="si-rule"></span></th>
            <th onclick="sortGaps('title')" title="Sort by title">Finding <span class="sort-ind" id="si-title"></span></th>
            ${isMulti?`<th onclick="sortGaps('part')" title="Sort by part">Part <span class="sort-ind" id="si-part"></span></th>`:""}
            <th onclick="sortGaps('cat')" title="Sort by category">Category <span class="sort-ind" id="si-cat"></span></th>
            <th>Impact</th>
            <th style="width:28px"></th>
          </tr>
        </thead>
        <tbody id="gapTbody"></tbody>
      </table>
    </div>
  `;

  renderGapRows();
}

function updateGapFilter(field, val){
  gapFilter[field] = val;
  renderGapRows();
}

function sortGaps(col){
  if(gapSortCol===col){ gapSortDir*=-1; }
  else { gapSortCol=col; gapSortDir=1; }
  renderGapRows();
}

function renderGapRows(){
  const c = CASES[currentCase];
  const isMulti = !!c.multi_part;
  let findings = [...c.gap_findings];

  // Filter
  if(gapFilter.sev!=="all") findings = findings.filter(g=>g.sev===gapFilter.sev);
  if(gapFilter.part!=="all") findings = findings.filter(g=>g.part===gapFilter.part);
  if(gapFilter.search){
    const q = gapFilter.search.toLowerCase();
    findings = findings.filter(g=>
      g.title.toLowerCase().includes(q)||
      g.rule.toLowerCase().includes(q)||
      g.cat.toLowerCase().includes(q)||
      (g.part&&g.part.toLowerCase().includes(q))||
      g.detail.toLowerCase().includes(q)
    );
  }

  // Sort
  findings.sort((a,b)=>{
    let av,bv;
    if(gapSortCol==="sev"){ av=SEV_ORDER[a.sev]??9; bv=SEV_ORDER[b.sev]??9; }
    else { av=(a[gapSortCol]||"").toLowerCase(); bv=(b[gapSortCol]||"").toLowerCase(); }
    if(av<bv) return -gapSortDir;
    if(av>bv) return gapSortDir;
    return 0;
  });

  // Update sort indicators
  ["sev","rule","title","cat","part"].forEach(col=>{
    const el=document.getElementById("si-"+col);
    if(!el) return;
    el.textContent = gapSortCol===col ? (gapSortDir===1?"▲":"▼") : "";
  });

  // Count label
  const lbl = document.getElementById("gapCountLabel");
  if(lbl) lbl.textContent = `${findings.length} of ${c.gap_findings.length} findings`;

  const tbody = document.getElementById("gapTbody");
  if(!tbody) return;

  if(findings.length===0){
    tbody.innerHTML = `<tr><td colspan="${isMulti?8:7}" class="empty">No findings match the current filters.</td></tr>`;
    return;
  }

  tbody.innerHTML = findings.map((g,i)=>{
    const rowId = "gr-"+i;
    const detId = "gd-"+i;

    const histHTML = g.hist ? `
      <div class="gd-hist">
        <div class="gh-item"><div class="ghl">Historical Projects</div><div class="ghv">${esc(g.hist.projects.join(", "))}</div></div>
        <div class="gh-item"><div class="ghl">${esc(g.hist.label)}</div><div class="ghv">${esc(g.hist.hist_val)}</div></div>
        <div class="gh-item"><div class="ghl">This RFQ</div><div class="ghv diff">${esc(g.hist.curr_val)}</div></div>
      </div>` : "";

    const detailHTML = `<tr class="gap-detail-row" id="${detId}">
      <td colspan="${isMulti?8:7}">
        <div class="gap-detail-inner">
          <div class="gd-block">
            <div class="gdl">Detail</div>
            <div class="gdt">${esc(g.detail)}</div>
          </div>
          <div class="gd-block">
            <div class="gdl">Impact</div>
            <div class="gdt" style="color:var(--bad)">${esc(g.impact)}</div>
            <div class="gdl" style="margin-top:10px">Evidence</div>
            <div class="gdt" style="font-family:var(--mono);font-size:11px">${esc(g.evidence)}</div>
          </div>
          <div class="gd-block" style="grid-column:span 2">
            <div class="gdl">Recommended Action</div>
            <div class="gdt">${esc(g.action)}</div>
          </div>
          ${histHTML}
        </div>
      </td>
    </tr>`;

    const row = `<tr class="gap-row" id="${rowId}" onclick="toggleGapRow('${rowId}','${detId}')">
      <td style="width:28px;color:var(--ink3);font-size:10px;padding-left:6px">
        <span class="row-expand-icon">▶</span>
      </td>
      <td><span class="sev ${SEV_CLASS[g.sev]}">${SEV_LABEL[g.sev]}</span></td>
      <td class="mono" style="font-size:10px;color:var(--slate)">${esc(g.rule)}</td>
      <td style="font-size:12px;font-weight:600;max-width:280px">${esc(g.title)}</td>
      ${isMulti?`<td style="font-size:11px;color:var(--ink2);white-space:nowrap">${esc(g.part||"—")}</td>`:""}
      <td><span class="tag">${esc(g.cat)}</span></td>
      <td style="font-size:11px;color:var(--ink2);max-width:200px">${esc(g.impact)}</td>
      <td style="width:28px;color:var(--ink3);font-size:11px">
        ${g.hist?'<span title="Has historical comparison" style="color:var(--slate)">H</span>':""}
      </td>
    </tr>`;

    return row + detailHTML;
  }).join("");
}

function toggleGapRow(rowId, detId){
  const row = document.getElementById(rowId);
  const det = document.getElementById(detId);
  if(!row||!det) return;
  const isOpen = det.classList.contains("open");
  // Close all open rows first
  document.querySelectorAll(".gap-detail-row.open").forEach(el=>el.classList.remove("open"));
  document.querySelectorAll(".gap-row.expanded").forEach(el=>el.classList.remove("expanded"));
  if(!isOpen){
    det.classList.add("open");
    row.classList.add("expanded");
  }
}

function renderQuote(){

  // Price band indicator
  const [pLo,pHi] = q.hist_price_band||[null,null];
  const quotedPrice = q.lines[0]?.price;
  let priceBandClass = "";
  if(pLo&&pHi&&quotedPrice){
    priceBandClass = quotedPrice<pLo?"band-ok":quotedPrice>pHi?"band-bad":"band-ok";
  }

  const cb = q.cost_breakdown;

  el.innerHTML = `

        </div>

        <div class="stat-tile">
          <div class="st-label">Risk Score</div>
          <div class="st-val num" style="color:${riskColor(q.risk_score)}">${q.risk_score}</div>
        </div>
        <div class="stat-tile">
          <div class="st-label">Validity</div>
          <div class="st-val num" style="font-size:16px">${q.validity?q.validity+" days":"Blocked"}</div>
        </div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-head">Line Items</div>
      <div class="tbl-wrap">
        <table>
          <thead><tr>
            <th>Part Number</th>
            <th>Description</th>
            <th>Plant</th>
            <th class="r">Volume</th>
            <th class="r">Unit Price</th>
            <th class="r">Tooling</th>
            <th class="r">Pkg/pc</th>
            <th class="r">Quality/pc</th>
            <th class="r">Margin %</th>
          </tr></thead>
          <tbody>
            ${q.lines.map(l=>`<tr>
              <td class="mono" style="font-size:11px">${esc(l.pn)}</td>
              <td style="font-size:12px">${esc(l.name)}</td>
              <td class="mono" style="font-size:11px">${esc(l.plant)}</td>
              <td class="r num">${fmtVol(l.vol)}</td>
              <td class="r num">${fmt$(l.price)}</td>

              <td class="r num${l.pkg===0?' bad':''}">${fmt$(l.pkg)}</td>
              <td class="r num">${fmt$(l.quality)}</td>
              <td class="r num${l.margin<12?' bad':l.margin<15?' warn':''}">${l.margin}%</td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>

    <div class="cost-grid">
      <div class="sec">
        <div class="sec-head">Cost Breakdown</div>
        <div class="tbl-wrap">
          <table>
            <thead><tr><th>Element</th><th class="r">$/pc</th><th class="r">% of Total</th></tr></thead>
            <tbody>
              ${Object.entries(cb).filter(([k])=>k!=="total").map(([k,v])=>{

      <div class="sec">
        <div class="sec-head">Historical Benchmark</div>
        <div class="tbl-wrap hist-table">
          <table>
            <thead><tr>
              <th>ID</th><th>Part Name</th>

          <strong>Caution:</strong> Risk score ${q.risk_score} — review all open findings before release.
        </div>`:`<div style="margin-top:10px;padding:10px 12px;background:var(--ok-soft);border:1px solid var(--ok-line);font-size:12px;color:var(--ok)">
          <strong>Cleared:</strong> Risk score ${q.risk_score} — quote is releasable pending final sign-off.
        </div>`}
      </div>
    </div>
  `;
}

/* ── CASE + TAB SWITCHING ── */
function selectCase(k){
  currentCase = k;
  gapFilter = {sev:"all", part:"all", search:""};
  gapSortCol = "sev";
  gapSortDir = 1;
  buildSidebar();
  buildHeader();
  renderAll();
}

let activeTab = "overview";
function switchTab(tab){
  activeTab = tab;
  document.querySelectorAll(".tab-btn").forEach(b=>{
    b.classList.toggle("active", b.dataset.tab===tab);
  });
  document.querySelectorAll(".panel").forEach(p=>{
    p.classList.toggle("active", p.id==="panel-"+tab);
  });
  // Lazy render on switch
  switch(tab){
    case "overview":   renderOverview(); break;
    case "documents":  renderDocuments(); break;
    case "part":       renderPart(); break;
    case "gaps":       renderGaps(); break;
    case "quote":      renderQuote(); break;
  }
}

function renderAll(){
  renderOverview();
  renderDocuments();
  renderPart();
  renderGaps();
  renderQuote();
}

/* ── INIT ── */
document.addEventListener("DOMContentLoaded", function(){
  buildSidebar();
  buildHeader();
  renderAll();

  // Tab strip click handler
  document.getElementById("tabStrip").addEventListener("click", function(e){
    const btn = e.target.closest(".tab-btn");
    if(btn && btn.dataset.tab) switchTab(btn.dataset.tab);
  });
});
</script>
